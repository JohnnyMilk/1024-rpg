<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0e1216"><title>1024 Tug of War V0.2</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0f12;color:#f3f5f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}body{background:radial-gradient(circle at 50% 0,#283139 0,#12181c 43%,#080b0d 100%);overscroll-behavior:none;touch-action:none}.app{width:min(96vw,500px);height:100%;margin:auto;padding:calc(env(safe-area-inset-top) + 5px) 0 calc(env(safe-area-inset-bottom) + 5px);display:flex;flex-direction:column;overflow:hidden}header{text-align:center;flex:0 0 auto}.eyebrow{font:900 10px ui-monospace,monospace;letter-spacing:.14em;color:#d5b86d}.app h1{font-size:20px;margin:2px 0 5px}.difficulty{display:flex;gap:4px;margin:0 auto 5px;width:190px}.difficulty button{flex:1;border:1px solid #45545c;background:#151d22;color:#8f9ca3;border-radius:8px;padding:3px;font-size:9px;font-weight:900}.difficulty button.active{color:#f3f5f6;border-color:#d5b86d;background:#2b2922}.scorebox{background:#151d22;border:1px solid #35434b;border-radius:14px;padding:7px;box-shadow:0 14px 36px #0005}.scores{display:flex;justify-content:space-between;align-items:end;margin-bottom:4px}.side{text-align:left}.side.cpu{text-align:right}.side small{display:block;color:#8f9ca3;font-size:9px;font-weight:900;letter-spacing:.12em}.side strong{font:900 21px ui-monospace,monospace}.side.player strong{color:#8ed0a4}.side.cpu strong{color:#df8d8d}.total{font-size:9px;color:#748188}.meter{height:23px;position:relative;border-radius:12px;overflow:hidden;background:#5a3034;border:1px solid #58656c}.playerbar{position:absolute;left:0;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#2f6847,#4e8d65);transition:width .5s cubic-bezier(.2,.8,.2,1)}.mid{position:absolute;top:0;bottom:0;width:2px;background:#fff;left:50%;transform:translateX(-1px);transition:left .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 8px #fff9}.meterlabels{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 9px;font-size:9px;font-weight:900;text-shadow:0 1px 2px #000}.turn{margin:5px auto 0;width:max-content;padding:4px 9px;border-radius:999px;background:#24322a;border:1px solid #496354;font-size:11px;font-weight:900;transition:.25s}.turn.cpu{background:#352526;border-color:#6c4649}.turn.combo{animation:pulse .38s}.boardwrap{position:relative;margin:6px auto 0;width:min(100%,calc(100vh - 285px));max-width:100%;flex:0 1 auto}.board{touch-action:none;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:6px;padding:7px;width:100%;aspect-ratio:1/1;background:#283239;border-radius:15px;overflow:hidden}.cell{position:relative;border-radius:12px;background:#12191d;border:1px solid #36434a;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}.tile{position:absolute;inset:4px;border-radius:9px;display:flex;align-items:center;justify-content:center;font:900 clamp(24px,8vw,42px) ui-monospace,monospace;color:#172025;background:#d6cbbd;box-shadow:0 4px 8px #0005}.tile.v2{background:#b8c7ae}.tile.v4{background:#91b2a4}.tile.v8{background:#7f9fa8;color:#17201c}.tile.v16{background:#8993ad}.tile.v32{background:#9b8fa9}.tile.v64{background:#b28f9a}.tile.v128{background:#bd9680}.tile.v256{background:#a9856f}.tile.v512{background:#8f756f;color:#f3eee9}.tile.v1024{background:#716361;color:#f3eee9}.tile.spawn{animation:spawn .26s cubic-bezier(.2,1.7,.4,1)}.tile.merge{animation:merge .34s cubic-bezier(.2,1.8,.4,1)}.mover{position:absolute;z-index:6;pointer-events:none;transition:transform .17s ease-in-out}.mover .tile{position:absolute;inset:0}.flash{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);z-index:8;font:900 26px ui-monospace,monospace;color:#fff;text-shadow:0 2px 8px #000;pointer-events:none;animation:scoreFly .65s forwards}.flash.gain{color:#8ed0a4}.flash.loss{color:#df8d8d}.panel{background:#151d22;border:1px solid #35434b;border-radius:11px;padding:5px 7px;margin-top:5px;flex:0 0 auto}.log{height:29px;overflow:hidden;color:#a8b4ba;font-size:10px;line-height:1.5}.hint{text-align:center;color:#819097;font-size:9px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:168px;margin:4px auto 0}.buttons button,.btn{appearance:none;border:1px solid #45545c;background:#192228;color:#edf2f4;border-radius:11px;min-height:32px;font-size:15px;font-weight:900}.buttons .blank{visibility:hidden}.btn{font-size:10px;width:100%;margin-top:4px;min-height:30px}.overlay{position:fixed;inset:0;background:#071014e8;display:none;align-items:center;justify-content:center;padding:24px;z-index:20}.overlay.show{display:flex}.modal{width:min(90vw,380px);background:#182127;border:1px solid #46545c;border-radius:20px;padding:22px;text-align:center}.modal .big{font-size:52px}.modal h2{margin:8px}.modal p{font-size:11px;color:#a9b5ba;line-height:1.6}@keyframes spawn{from{transform:scale(.15);opacity:.15}to{transform:scale(1);opacity:1}}@keyframes merge{0%{transform:scale(.82)}55%{transform:scale(1.25);filter:brightness(1.5)}100%{transform:scale(1)}}@keyframes scoreFly{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}35%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-130%) scale(.9)}}@keyframes pulse{50%{transform:scale(1.08)}}@media(max-height:700px){.eyebrow{font-size:8px}.app h1{font-size:17px;margin:1px 0 3px}.scorebox{padding:5px}.side strong{font-size:18px}.meter{height:20px}.turn{font-size:9px;margin-top:3px;padding:3px 7px}.boardwrap{width:min(100%,calc(100vh - 240px));margin-top:4px}.panel{padding:3px 6px;margin-top:3px}.log{height:16px;white-space:nowrap}.hint{display:none}.buttons{margin-top:3px}.buttons button{min-height:28px}.btn{min-height:27px;margin-top:3px}}
</style></head><body><main class="app"><header><div class="eyebrow">TYPE 03 · PLAYER VS CPU · V0.2 POC</div><h1>1024 · TUG OF WAR</h1></header><div class="difficulty"><button onclick="setDifficulty('easy')">EASY</button><button class="active" onclick="setDifficulty('normal')">NORMAL</button><button onclick="setDifficulty('hard')">HARD</button></div>
<section class="scorebox"><div class="scores"><div class="side player"><small>PLAYER</small><strong id="ps">1024</strong></div><div class="total">TOTAL 2048</div><div class="side cpu"><small>CPU</small><strong id="cs">1024</strong></div></div><div class="meter"><div id="pbar" class="playerbar"></div><div id="mid" class="mid"></div><div class="meterlabels"><span>YOU</span><span>CPU</span></div></div><div id="turn" class="turn">● YOUR TURN</div></section>
<div id="boardwrap" class="boardwrap"><div id="board" class="board"></div></div>
<div class="buttons"><span class="blank"></span><button onclick="playerMove('U')">▲</button><span class="blank"></span><button onclick="playerMove('L')">◀</button><button onclick="playerMove('D')">▼</button><button onclick="playerMove('R')">▶</button></div>
<section class="panel"><div id="log" class="log">玩家先手。Merge 就搶分並繼續行動；沒有 Merge 就換 CPU。</div><div class="hint">每次有效移動都會出生新 Tile。雙方分數總和永遠是 2048。</div></section><button class="btn" onclick="restart()">↻ 重新開始</button></main>
<div id="overlay" class="overlay"><div class="modal"><div id="mi" class="big">🏆</div><h2 id="mt"></h2><p id="mx"></p><button class="btn" onclick="closeModal()">再來一局</button></div></div>
<script>
let B=[],player=1024,cpu=1024,who='p',locked=false,over=false,lastSpawn=-1,lastMerge=[],difficulty='normal';const dirs=['L','R','U','D'];
function empty(){return Array(16).fill(0)}function rc(i){return[Math.floor(i/4),i%4]}function id(r,c){return r*4+c}
function lineIds(n,d){let a=[];if(d==='L')for(let c=0;c<4;c++)a.push(id(n,c));if(d==='R')for(let c=3;c>=0;c--)a.push(id(n,c));if(d==='U')for(let r=0;r<4;r++)a.push(id(r,n));if(d==='D')for(let r=3;r>=0;r--)a.push(id(r,n));return a}
function calc(board,d){let out=empty(),score=0,trans=[],merges=[];for(let n=0;n<4;n++){let ids=lineIds(n,d),items=ids.map(i=>({v:board[i],src:i})).filter(x=>x.v),dest=0;for(let i=0;i<items.length;i++){let a=items[i],di=ids[dest];if(i+1<items.length&&a.v===items[i+1].v){let b=items[++i],v=a.v*2;out[di]=v;score+=v;merges.push(di);trans.push({src:a.src,dst:di,v:a.v});trans.push({src:b.src,dst:di,v:b.v});dest++}else{out[di]=a.v;trans.push({src:a.src,dst:di,v:a.v});dest++}}}let changed=board.some((v,i)=>v!==out[i]);return{out,score,trans,merges,changed}}
function legal(){return dirs.some(d=>calc(B,d).changed)}
function addTile(){let e=B.map((v,i)=>v?null:i).filter(i=>i!==null);if(!e.length)return-1;let i=e[Math.floor(Math.random()*e.length)];B[i]=Math.random()<.9?1:2;return i}
function restart(){B=empty();addTile();addTile();lastSpawn=addTile();player=cpu=1024;who='p';locked=over=false;lastMerge=[];overlay.classList.remove('show');say('玩家先手。Merge 就搶分並繼續行動；沒有 Merge 就換 CPU。');render()}
function tileClass(v){return'v'+Math.min(1024,v)}
function render(){board.innerHTML=B.map((v,i)=>'<div class="cell">'+(v?'<div class="tile '+tileClass(v)+' '+(i===lastSpawn?'spawn ':'')+(lastMerge.includes(i)?'merge ':'')+'">'+v+'</div>':'')+'</div>').join('');lastSpawn=-1;lastMerge=[];ps.textContent=player;cs.textContent=cpu;let pct=player/2048*100;pbar.style.width=pct+'%';mid.style.left=pct+'%';turn.textContent=who==='p'?'● YOUR TURN':'● CPU TURN';turn.className='turn '+(who==='c'?'cpu':'')}
function say(s){log.innerHTML=s+'<br>'+log.innerHTML.split('<br>').slice(0,2).join('<br>')}
function transfer(gain,side){let take=side==='p'?Math.min(gain,cpu):Math.min(gain,player);if(side==='p'){player+=take;cpu-=take}else{cpu+=take;player-=take}scoreFlash((side==='p'?'+':'-')+take,side==='p'?'gain':'loss');return take}
function scoreFlash(txt,kind){let e=document.createElement('div');e.className='flash '+kind;e.textContent=txt;boardwrap.appendChild(e);setTimeout(()=>e.remove(),700)}
function animateMove(res,done){locked=true;let rect=board.getBoundingClientRect(),cells=[...board.children];let movingSources=new Set(res.trans.filter(t=>t.src!==t.dst).map(t=>t.src));movingSources.forEach(i=>{let tile=cells[i].querySelector('.tile');if(tile)tile.style.visibility='hidden'});res.trans.filter(t=>t.src!==t.dst).forEach(t=>{let a=cells[t.src].getBoundingClientRect(),b=cells[t.dst].getBoundingClientRect(),m=document.createElement('div');m.className='mover';m.style.left=(a.left-rect.left+4)+'px';m.style.top=(a.top-rect.top+4)+'px';m.style.width=(a.width-8)+'px';m.style.height=(a.height-8)+'px';m.innerHTML='<div class="tile '+tileClass(t.v)+'">'+t.v+'</div>';boardwrap.appendChild(m);requestAnimationFrame(()=>m.style.transform='translate('+(b.left-a.left)+'px,'+(b.top-a.top)+'px)');setTimeout(()=>m.remove(),190)});setTimeout(()=>{B=res.out;lastMerge=res.merges.slice();lastSpawn=addTile();render();locked=false;done()},190)}
function execute(d,side){if(over||locked||who!==side)return;let res=calc(B,d);if(!res.changed){say((side==='p'?'玩家':'CPU')+'：這個方向沒有任何單位移動，不計算回合。');return}animateMove(res,()=>{if(res.score>0){let got=transfer(res.score,side);say((side==='p'?'玩家':'CPU')+' Merge 得 '+res.score+'，實際搶走 '+got+' 分，再動一次！');turn.classList.add('combo');setTimeout(()=>turn.classList.remove('combo'),300);render();if(checkEnd())return;if(side==='c')setTimeout(cpuTurn,520)}else{say((side==='p'?'玩家':'CPU')+' 本次沒有 Merge，交換回合。');who=side==='p'?'c':'p';render();if(checkEnd())return;if(who==='c')setTimeout(cpuTurn,520)}})}
function playerMove(d){execute(d,'p')}
function setDifficulty(v){difficulty=v;document.querySelectorAll('.difficulty button').forEach((b,i)=>b.classList.toggle('active',['easy','normal','hard'][i]===v));say('CPU 難度：'+v.toUpperCase())}
function boardRank(b){let empt=b.filter(v=>!v).length,max=Math.max(...b),corner=[0,3,12,15].some(i=>b[i]===max)?24:0;return empt*5+corner}
function bestPlayerReply(b){let best=0;for(let d of dirs){let r=calc(b,d);if(r.changed)best=Math.max(best,r.score*20+boardRank(r.out))}return best}
function cpuTurn(){if(over||locked||who!=='c')return;if(!legal()){checkEnd(true);return}let choices=dirs.map(d=>({d,r:calc(B,d)})).filter(x=>x.r.changed);if(difficulty==='easy'){execute(choices[Math.floor(Math.random()*choices.length)].d,'c');return}choices.forEach(x=>{x.rank=x.r.score*20+boardRank(x.r.out)+Math.random()*3;if(difficulty==='hard')x.rank-=bestPlayerReply(x.r.out)*.85});choices.sort((a,b)=>b.rank-a.rank);execute(choices[0].d,'c')}
function checkEnd(force=false){if(player<=0){finish('c');return true}if(cpu<=0){finish('p');return true}if(force||!legal()){finish(player===cpu?'d':player>cpu?'p':'c',true);return true}return false}
function finish(win,stuck=false){over=true;locked=true;let title=win==='p'?'你獲勝！':win==='c'?'CPU 獲勝':'平手';mi.textContent=win==='p'?'🏆':win==='c'?'🤖':'🤝';mt.textContent=title;mx.textContent=(stuck?'棋盤已無法繼續移動。':'一方分數已被完全壓制。')+' 最終比分 PLAYER '+player+' : '+cpu+' CPU。';setTimeout(()=>overlay.classList.add('show'),350)}
function closeModal(){restart()}
let sx=0,sy=0;board.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});board.addEventListener('touchend',e=>{if(who!=='p'||locked)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;playerMove(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))});document.addEventListener('keydown',e=>{let m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R'};if(m[e.key]){e.preventDefault();playerMove(m[e.key])}});restart();
</script></body></html>
