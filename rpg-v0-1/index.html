<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101419"><title>1024 RPG Prototype v0.1</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#101419;color:#eef3f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}body{display:flex;justify-content:center;overscroll-behavior:none}.app{width:min(96vw,560px);padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 28px)}a{color:#9da9b5;text-decoration:none;font-weight:800}.top{display:flex;justify-content:space-between;gap:12px;margin-top:12px}.top h1{font-size:30px;margin:0;line-height:1}.sub{font-size:12px;color:#8e9aa6;margin-top:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;min-width:220px}.stat{background:#1a2027;border:1px solid #2a323b;border-radius:10px;padding:7px;text-align:center}.stat span{display:block;font-size:9px;letter-spacing:.08em;color:#7f8b96;font-weight:900}.stat b{font-size:16px}.bar{display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px;gap:8px}.buttons{display:flex;gap:7px}button{border:0;border-radius:10px;background:#2c3743;color:#fff;padding:9px 11px;font-weight:900;font-size:12px}.turnnote{font-size:11px;color:#8996a2;text-align:right}.battlelog{background:#171c22;border:1px solid #272f37;border-radius:12px;padding:9px 11px;margin-bottom:10px;min-height:38px;font-size:12px;color:#b8c3cd;line-height:1.45}.board{position:relative;width:min(91vw,500px);aspect-ratio:1;margin:auto;background:#252d35;border-radius:18px;padding:10px;touch-action:none;user-select:none;overflow:hidden}.grid{position:absolute;inset:10px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px}.cell{background:#151a20;border:1px solid #303944;border-radius:12px}.pieces{position:absolute;inset:10px}.piece{position:absolute;width:calc((100% - 24px)/4);height:calc((100% - 24px)/4);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 4px 14px #0003;transition:transform .16s cubic-bezier(.2,.8,.2,1);overflow:hidden}.piece .icon{font-size:26px;line-height:1}.piece .name{font-size:11px;font-weight:900;margin-top:3px}.piece .tier{font-size:10px;opacity:.8}.hp{position:absolute;left:6px;right:6px;bottom:5px;height:4px;background:#0005;border-radius:99px;overflow:hidden}.hp i{display:block;height:100%;background:#9bd27f}.warrior{background:linear-gradient(145deg,#7f5e4c,#4e3b32)}.mage{background:linear-gradient(145deg,#485f8f,#283754)}.priest{background:linear-gradient(145deg,#7f7150,#504832)}.enemy{background:linear-gradient(145deg,#6f3f46,#3f252a)}.boss{background:linear-gradient(145deg,#873a3a,#401919);box-shadow:0 0 20px #c34b4b55}.spawn{animation:spawn .18s ease-out}.merge{animation:merge .22s ease-out}.hit{animation:hit .22s ease}.heal{animation:heal .25s ease}@keyframes spawn{0%{scale:.3;opacity:.2}100%{scale:1;opacity:1}}@keyframes merge{0%{scale:.75}55%{scale:1.16}100%{scale:1}}@keyframes hit{0%,100%{filter:none}50%{filter:brightness(2)}}@keyframes heal{0%,100%{box-shadow:0 4px 14px #0003}50%{box-shadow:0 0 26px #87e6a5}}.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:11px auto 0;max-width:500px}.legend div{background:#171d23;border:1px solid #28313a;border-radius:10px;padding:8px;font-size:10px;color:#9aa7b2;line-height:1.4}.legend b{display:block;color:#e7edf2;font-size:11px}.overlay{position:absolute;inset:0;z-index:10;background:#0f1318e8;display:none;align-items:center;justify-content:center;text-align:center;padding:28px}.overlay.show{display:flex}.overlay h2{font-size:32px;margin:0 0 8px}.overlay p{color:#aab6c0;line-height:1.6}.overlay .row{display:flex;gap:8px;justify-content:center}.help{margin:13px auto 0;max-width:500px;color:#8f9aa5;font-size:11px;line-height:1.55}.help b{color:#c8d1d9}@media(max-width:410px){.top{display:block}.stats{margin-top:10px;min-width:0}.piece .icon{font-size:23px}.piece .name{font-size:10px}}</style></head><body><div class="app"><a href="../">← Prototype Index</a><div class="top"><div><h1>1024 RPG</h1><div class="sub">Prototype v0.1 · 滑動就是一個戰鬥回合</div></div><div class="stats"><div class="stat"><span>TURN</span><b id="turn">0</b></div><div class="stat"><span>KILLS</span><b id="kills">0</b></div><div class="stat"><span>BOSS</span><b id="bossState">20</b></div></div></div><div class="bar"><div class="buttons"><button id="restart">重新開始</button><button id="helpBtn">規則</button></div><div class="turnnote">手機滑動<br>電腦方向鍵 / WASD</div></div><div class="battlelog" id="log">合併同職業、同階級角色，活到 Boss 出現並擊敗它。</div><div class="board" id="board"><div class="grid" id="grid"></div><div class="pieces" id="pieces"></div><div class="overlay" id="overlay"><div><h2 id="overTitle"></h2><p id="overText"></p><div class="row"><button id="again">再玩一次</button><button id="closeHelp">返回</button></div></div></div></div><div class="legend"><div><b>⚔️ 戰士</b>合成時對相鄰敵人造成階級×2傷害。</div><div><b>🔮 法師</b>合成時對全場敵人造成階級傷害。</div><div><b>✦ 牧師</b>合成時治療所有我方角色。</div></div><div class="help"><b>核心：</b>英雄會依 1024 規則滑動；敵人是障礙物，不會被你推動。每次有效滑動後，敵人先攻擊相鄰英雄，否則往最近英雄移動。每 3 回合生成哥布林，每次有效滑動也可能生成新英雄。第 20 回合 Boss 進場。</div></div><script>(function(){'use strict';const N=4,BOSS_TURN=20;const boardEl=document.getElementById('board'),gridEl=document.getElementById('grid'),piecesEl=document.getElementById('pieces'),logEl=document.getElementById('log');const turnEl=document.getElementById('turn'),killsEl=document.getElementById('kills'),bossStateEl=document.getElementById('bossState');const overlay=document.getElementById('overlay'),overTitle=document.getElementById('overTitle'),overText=document.getElementById('overText'),closeHelp=document.getElementById('closeHelp');for(let i=0;i<16;i++){const d=document.createElement('div');d.className='cell';gridEl.appendChild(d)}let entities=[],turn=0,kills=0,nextId=1,locked=false,touch=null,bossSpawned=false,gameEnded=false,lastFx={};const classes=['warrior','mage','priest'];const names={warrior:'戰士',mage:'法師',priest:'牧師'};const icons={warrior:'⚔️',mage:'🔮',priest:'✦',enemy:'👺',boss:'👹'};function maxHp(e){if(e.type==='hero')return 6+e.tier*3;if(e.type==='boss')return 42;return 8+Math.floor(turn/5)*2}function heroPower(e){return Math.max(2,e.tier*2)}function rand(a){return a[Math.floor(Math.random()*a.length)]}function emptyCells(){const used=new Set(entities.map(e=>e.r+','+e.c)),a=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!used.has(r+','+c))a.push([r,c]);return a}function addHero(){const e=emptyCells();if(!e.length)return null;const [r,c]=rand(e),h={id:nextId++,type:'hero',cls:rand(classes),tier:2,r,c,hp:12};h.hp=maxHp(h);entities.push(h);return h.id}function addEnemy(boss=false){const e=emptyCells();if(!e.length)return null;const [r,c]=rand(e),x={id:nextId++,type:boss?'boss':'enemy',r,c,hp:boss?42:8+Math.floor(turn/5)*2};entities.push(x);return x.id}function step(){const w=piecesEl.clientWidth,g=8,s=(w-g*3)/4;return s+g}function render(){piecesEl.innerHTML='';const st=step();for(const e of entities){const d=document.createElement('div');d.className='piece '+(e.type==='hero'?e.cls:e.type)+(lastFx[e.id]?' '+lastFx[e.id]:'');d.style.transform='translate('+(e.c*st)+'px,'+(e.r*st)+'px)';let label=e.type==='hero'?names[e.cls]:(e.type==='boss'?'BOSS':'哥布林');let tier=e.type==='hero'?'T'+e.tier:'HP '+e.hp;d.innerHTML='<div class="icon">'+icons[e.type==='hero'?e.cls:e.type]+'</div><div class="name">'+label+'</div><div class="tier">'+tier+'</div><div class="hp"><i style="width:'+Math.max(0,Math.min(100,e.hp/maxHp(e)*100))+'%"></i></div>';piecesEl.appendChild(d)}lastFx={};turnEl.textContent=turn;killsEl.textContent=kills;bossStateEl.textContent=bossSpawned?'IN':Math.max(0,BOSS_TURN-turn)}function reset(){entities=[];turn=0;kills=0;nextId=1;locked=false;bossSpawned=false;gameEnded=false;overlay.classList.remove('show');addHero();addHero();addHero();log('三名冒險者進入遺跡。');render()}function log(t){logEl.textContent=t}function getAt(r,c){return entities.find(e=>e.r===r&&e.c===c)}function removeDead(){const before=entities.length;entities=entities.filter(e=>{if(e.hp>0)return true;if(e.type==='enemy'||e.type==='boss'){kills++;return false}return false});return before!==entities.length}function damage(e,n){e.hp-=n;lastFx[e.id]='hit'}function healAll(n){for(const e of entities)if(e.type==='hero'){e.hp=Math.min(maxHp(e),e.hp+n);lastFx[e.id]='heal'}}function classEffect(h){if(h.cls==='warrior'){let hit=0;for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const t=getAt(h.r+dr,h.c+dc);if(t&&(t.type==='enemy'||t.type==='boss')){damage(t,h.tier*2);hit++}}return hit?'戰士揮出重擊。':'戰士進階。'}if(h.cls==='mage'){let hit=0;for(const t of entities)if(t.type==='enemy'||t.type==='boss'){damage(t,h.tier);hit++}return hit?'法師的魔力掃過全場。':'法師進階。';}healAll(Math.max(2,h.tier));return'牧師為隊伍治療。'}function orderFor(dir){let hs=entities.filter(e=>e.type==='hero');if(dir==='left')hs.sort((a,b)=>a.r-b.r||a.c-b.c);if(dir==='right')hs.sort((a,b)=>a.r-b.r||b.c-a.c);if(dir==='up')hs.sort((a,b)=>a.c-b.c||a.r-b.r);if(dir==='down')hs.sort((a,b)=>a.c-b.c||b.r-a.r);return hs}function moveHero(h,dir,mergedSet){const [dr,dc]=dir==='left'?[0,-1]:dir==='right'?[0,1]:dir==='up'?[-1,0]:[1,0];let moved=false;while(true){const nr=h.r+dr,nc=h.c+dc;if(nr<0||nr>=N||nc<0||nc>=N)break;const o=getAt(nr,nc);if(!o){h.r=nr;h.c=nc;moved=true;continue}if(o.type==='hero'&&o.cls===h.cls&&o.tier===h.tier&&!mergedSet.has(o.id)&&!mergedSet.has(h.id)){o.tier*=2;o.hp=maxHp(o);mergedSet.add(o.id);h.hp=0;moved=true;lastFx[o.id]='merge';const msg=classEffect(o);log(msg);break}break}return moved}function playerMove(dir){if(locked||gameEnded||overlay.classList.contains('show'))return;locked=true;let changed=false;const merged=new Set();for(const h of orderFor(dir)){if(h.hp<=0)continue;if(moveHero(h,dir,merged))changed=true}entities=entities.filter(e=>e.hp>0);removeDead();if(!changed){locked=false;render();return}turn++;enemyPhase();removeDead();if(!gameEnded){if(turn%3===0)addEnemy(false);if(Math.random()<.72)addHero();if(turn>=BOSS_TURN&&!bossSpawned){bossSpawned=true;addEnemy(true);log('Boss 進場！清出空間並擊敗它。')}}checkEnd();render();setTimeout(()=>locked=false,120)}function nearestHero(e){const hs=entities.filter(x=>x.type==='hero');if(!hs.length)return null;hs.sort((a,b)=>(Math.abs(a.r-e.r)+Math.abs(a.c-e.c))-(Math.abs(b.r-e.r)+Math.abs(b.c-e.c)));return hs[0]}function enemyPhase(){const es=entities.filter(e=>e.type==='enemy'||e.type==='boss');for(const e of es){if(e.hp<=0)continue;let adj=null;for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const t=getAt(e.r+dr,e.c+dc);if(t&&t.type==='hero'){adj=t;break}}if(adj){damage(adj,e.type==='boss'?6:3);log((e.type==='boss'?'Boss':'哥布林')+' 攻擊了 '+names[adj.cls]+'。');continue}const h=nearestHero(e);if(!h)continue;const choices=[];if(Math.abs(h.r-e.r)>=Math.abs(h.c-e.c)){choices.push([Math.sign(h.r-e.r),0],[0,Math.sign(h.c-e.c)])}else choices.push([0,Math.sign(h.c-e.c)],[Math.sign(h.r-e.r),0]);for(const [dr,dc] of choices){const nr=e.r+dr,nc=e.c+dc;if(dr===0&&dc===0)continue;if(nr>=0&&nr<N&&nc>=0&&nc<N&&!getAt(nr,nc)){e.r=nr;e.c=nc;break}}}}function checkEnd(){const heroes=entities.filter(e=>e.type==='hero');const boss=entities.find(e=>e.type==='boss');if(bossSpawned&&!boss&&kills>0){end(true,'你擊敗 Boss！','Prototype v0.1 通關。這代表「1024 + 回合戰鬥」的核心循環已經可以測試。');return}if(!heroes.length){end(false,'隊伍全滅','所有英雄都被擊倒。');return}if(!emptyCells().length){let any=false;for(const h of heroes)for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const o=getAt(h.r+dr,h.c+dc);if(!o||o.type==='hero'&&o.cls===h.cls&&o.tier===h.tier)any=true}if(!any)end(false,'盤面被封死','沒有空格，也沒有可合成的角色。')}}function end(win,title,text){gameEnded=true;overTitle.textContent=title;overText.textContent=text;closeHelp.style.display='none';overlay.classList.add('show')}function showHelp(){overTitle.textContent='玩法規則';overText.textContent='滑動英雄；相同職業與階級可合成。戰士合成後攻擊鄰格、法師攻擊全場、牧師治療。敵人每回合移動或攻擊。第 20 回合 Boss 出現。';closeHelp.style.display='inline-block';overlay.classList.add('show')}window.addEventListener('keydown',e=>{const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};const d=m[e.key]||m[e.key.toLowerCase()];if(d){e.preventDefault();playerMove(d)}},{passive:false});boardEl.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touch={x:t.clientX,y:t.clientY}},{passive:true});boardEl.addEventListener('touchend',e=>{if(!touch)return;const t=e.changedTouches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;playerMove(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});document.getElementById('restart').onclick=reset;document.getElementById('again').onclick=reset;document.getElementById('helpBtn').onclick=showHelp;closeHelp.onclick=()=>overlay.classList.remove('show');window.addEventListener('resize',render);reset()})();</script></body></html>
