<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#10151a">
<title>Type 02 · Dungeon V0.1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1013;color:#edf2f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}body{background:radial-gradient(circle at 50% 0,#273322 0,#11191c 45%,#080c0e 100%);overscroll-behavior:none}.app{width:min(94vw,520px);margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 0 calc(env(safe-area-inset-bottom) + 24px)}header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}.brand b{font:900 10px ui-monospace,monospace;letter-spacing:.12em;color:#d7b46a}.brand h1{font-size:24px;margin:3px 0}.chips{display:flex;gap:5px}.chip{background:#182127;border:1px solid #344149;border-radius:10px;padding:6px 8px;font-size:10px;font-weight:900;text-align:center}.chip strong{display:block;font-size:15px;color:#fff}.panel{background:#131b1fee;border:1px solid #354249;border-radius:18px;padding:12px;margin:9px 0;box-shadow:0 16px 40px #0005}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.board{touch-action:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:7px;background:#263137;border-radius:18px;padding:9px;width:100%;aspect-ratio:1/1;overflow:hidden}.cell{position:relative;min-width:0;min-height:0;border-radius:12px;background:#10171a;border:1px solid #344149;display:flex;align-items:center;justify-content:center;overflow:hidden}.cell.wall{background:#252a2c;border-color:#4b5154}.unit{font-size:35px;line-height:1;filter:drop-shadow(0 3px 4px #0008)}.num{position:absolute;right:5px;bottom:4px;min-width:23px;height:20px;padding:2px 5px;border-radius:8px;background:#080b0dcc;color:#fff;font:900 12px ui-monospace,monospace;text-align:center}.player{background:#294335;border-color:#5b886b}.enemy{background:#492b2e;border-color:#815156}.loot{background:#403b28;border-color:#796b43}.exit{background:#293e49;border-color:#52788a}.boss{background:#512d45;border-color:#a55b8c}.merge{animation:merge .28s cubic-bezier(.2,1.7,.4,1)}.hit{animation:hit .24s}.spawn{animation:spawn .25s cubic-bezier(.2,1.7,.4,1)}@keyframes merge{50%{transform:scale(1.16);filter:brightness(1.6)}}@keyframes hit{50%{transform:translateX(-5px);filter:brightness(2)}}@keyframes spawn{from{transform:scale(.3);opacity:.2}to{transform:scale(1);opacity:1}}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.title h2{font-size:17px;margin:0}.log{height:62px;overflow:hidden;color:#aebbc0;font-size:11px;line-height:1.5}.hint{text-align:center;color:#85949b;font-size:10px;margin:8px 0 2px}.btn{appearance:none;width:100%;border:1px solid #46555d;background:#182127;color:#edf2f4;border-radius:14px;padding:13px;font-weight:900;font-size:14px}.btn.gold{background:#d7b46a;border-color:#d7b46a;color:#19160f}.row{display:flex;gap:8px}.row>*{flex:1}.legend{font-size:10px;color:#9daab0;line-height:1.6}.overlay{position:fixed;inset:0;background:#071014e8;display:none;align-items:center;justify-content:center;padding:24px;z-index:10}.overlay.show{display:flex}.modal{width:min(90vw,390px);background:#182127;border:1px solid #46545c;border-radius:20px;padding:22px;text-align:center}.modal .big{font-size:52px}.modal h2{margin:8px}.modal p{color:#a9b5ba;font-size:12px;line-height:1.6}@media(max-height:760px){.app{padding-top:7px}.panel{padding:9px}.board{gap:5px;padding:7px}.cell{border-radius:9px}.unit{font-size:30px}}
</style></head><body><main class="app">
<header><div class="brand"><b>TYPE 02 · DUNGEON-FIRST · V0.1</b><h1>無盡地下城</h1></div><div class="chips"><div class="chip">BEST<strong id="best">1F</strong></div><div class="chip">BANK<strong id="bank">🦴0</strong></div></div></header>
<div class="hud"><div class="chip">HP<strong id="hp">10 / 10</strong></div><div class="chip">樓層<strong id="floor">1F</strong></div><div class="chip">戰利品<strong id="lootHud">🦴0</strong></div><div class="chip">回合<strong id="turn">0</strong></div></div>
<section class="panel"><div class="title"><h2 id="floorName">🌲 苔痕地窟</h2><span class="chip" id="status">SWIPE</span></div><div id="board" class="board"></div><div class="hint">上下左右滑動。你移動一格，同時怪物也會滑動；相同怪物碰撞會合併升階。</div></section>
<section class="panel"><div class="title"><h2>探索紀錄</h2><span class="chip">RUN</span></div><div id="log" class="log"></div><div class="legend">🧙 你　👺 數值怪物　🦴 戰利品　⬇️ 下一層　👑 每 5 層 Boss<br>怪物數值 = HP / 攻擊威脅。高階怪物掉落更多素材。</div></section>
<div class="row"><button class="btn gold" onclick="retreat()">🏰 安全撤退</button><button class="btn" onclick="restart()">↻ 重新開始</button></div>
</main>
<div id="overlay" class="overlay"><div class="modal"><div class="big" id="mIcon">💀</div><h2 id="mTitle"></h2><p id="mText"></p><button class="btn gold" onclick="closeModal()">再進地下城</button></div></div>
<script>
const G={bank:0,best:1};let D,fx={};const N=4;
const THEMES=[['🌲 苔痕地窟','#294335'],['🪨 赤岩坑道','#4b352b'],['❄️ 霜封遺跡','#293d4c']];
function blank(){return Array(16).fill(null)}
function pos(i){return[Math.floor(i/4),i%4]}function idx(r,c){return r*4+c}function inside(r,c){return r>=0&&r<4&&c>=0&&c<4}
function randEmpty(){let e=D.b.map((v,i)=>v?null:i).filter(v=>v!==null);return e.length?e[Math.floor(Math.random()*e.length)]:-1}
function put(o){let i=randEmpty();if(i>=0)D.b[i]=o;return i}
function enemy(level=2,boss=false){return{t:boss?'boss':'e',v:level,hp:boss?level*3:level}}
function restart(){D={b:blank(),hp:10,max:10,floor:1,loot:0,turn:0,dead:false};newFloor(true);render()}
function newFloor(first=false){D.b=blank();let p=Math.floor(Math.random()*16);D.b[p]={t:'p'};let base=Math.pow(2,Math.min(4,Math.floor((D.floor-1)/3)+1));if(D.floor%5===0){put(enemy(Math.max(4,base*2),true));put({t:'loot'});write('👑 Boss 樓層：擊敗守門者並找到出口。')}else{let count=1+Math.min(3,Math.floor((D.floor-1)/2));for(let i=0;i<count;i++)put(enemy(Math.random()<.7?base:base*2));put({t:'loot'});if(D.floor>2&&Math.random()<.55)put({t:'loot'});write((first?'你進入地下城。':'⬇️ 進入 '+D.floor+'F。')+' 小心 Swipe 讓怪物互相合併。')}put({t:'x'});fx={spawn:true};G.best=Math.max(G.best,D.floor)}
function write(s){log.innerHTML=s+'<br>'+log.innerHTML.split('<br>').slice(0,3).join('<br>')}
function dirVec(d){return d==='U'?[-1,0]:d==='D'?[1,0]:d==='L'?[0,-1]:[0,1]}
function playerMove(d){let p=D.b.findIndex(x=>x&&x.t==='p'),[r,c]=pos(p),[dr,dc]=dirVec(d),nr=r+dr,nc=c+dc;if(!inside(nr,nc))return false;let q=idx(nr,nc),t=D.b[q];if(t&&t.t==='e'||t&&t.t==='boss'){let dmg=Math.max(1,Math.floor(t.v/2));t.hp-=2;D.hp-=dmg;fx={hit:q};write('⚔️ 交戰：你造成 2 傷害，受到 '+dmg+' 傷害。');if(t.hp<=0){let gain=t.t==='boss'?Math.max(3,t.v):Math.max(1,Math.log2(t.v));D.loot+=gain;D.b[q]={t:'p'};D.b[p]=null;write((t.t==='boss'?'👑 Boss':'👺 怪物')+' 被擊敗，獲得 🦴'+gain+'。')}if(D.hp<=0){die();return true}return true}if(t&&t.t==='loot'){D.loot++;write('🦴 撿到素材，本輪戰利品 +1。')}if(t&&t.t==='x'){D.floor++;newFloor();return true}if(!t||t.t==='loot'||t.t==='x'){D.b[p]=null;D.b[q]={t:'p'};return true}return false}
function slideEnemies(d){let [dr,dc]=dirVec(d),order=[...Array(16).keys()];if(d==='D')order.sort((a,b)=>b-a);if(d==='R')order.sort((a,b)=>(b%4)-(a%4));if(d==='U')order.sort((a,b)=>a-b);if(d==='L')order.sort((a,b)=>(a%4)-(b%4));let moved=new Set();for(let i of order){let a=D.b[i];if(!a||(a.t!=='e'&&a.t!=='boss')||moved.has(a))continue;let [r,c]=pos(i),nr=r,nc=c;while(true){let tr=nr+dr,tc=nc+dc;if(!inside(tr,tc))break;let q=idx(tr,tc),b=D.b[q];if(!b){nr=tr;nc=tc;continue}if((b.t===a.t||a.t==='e'&&b.t==='e')&&b.v===a.v&&!moved.has(b)){let ni=idx(nr,nc);if(ni!==i){D.b[ni]=a;D.b[i]=null;i=ni}D.b[q]=enemy(a.v*2,a.t==='boss'||b.t==='boss');moved.add(D.b[q]);fx={merge:q};write('⚠️ '+a.v+' + '+b.v+' → '+(a.v*2)+'，怪物合併變強！');nr=tr;nc=tc;break}break}let ni=idx(nr,nc);if(ni!==i&&D.b[i]===a){D.b[ni]=a;D.b[i]=null}}
}
function enemyAttack(){let p=D.b.findIndex(x=>x&&x.t==='p');if(p<0)return;let [pr,pc]=pos(p);for(let i=0;i<16;i++){let e=D.b[i];if(!e||(e.t!=='e'&&e.t!=='boss'))continue;let[r,c]=pos(i);if(Math.abs(r-pr)+Math.abs(c-pc)===1){let dmg=Math.max(1,Math.floor(e.v/2));D.hp-=dmg;fx={hit:p};write((e.t==='boss'?'👑':'👺')+' 鄰接攻擊，你受到 '+dmg+' 傷害。');if(D.hp<=0){die();return}}}}
function swipe(d){if(D.dead)return;let acted=playerMove(d);if(D.dead)return;if(!acted)return;D.turn++;slideEnemies(d);enemyAttack();if(D.dead)return;render()}
function die(){D.dead=true;let lost=D.loot;G.best=Math.max(G.best,D.floor);render();setTimeout(()=>showModal('💀','探索失敗','你倒在 '+D.floor+'F，本輪 🦴'+lost+' 全部失去。城鎮庫存不受影響。'),220)}
function retreat(){if(D.dead)return;G.bank+=D.loot;G.best=Math.max(G.best,D.floor);let got=D.loot;D.loot=0;showModal('🏰','安全撤退','你從 '+D.floor+'F 返回城鎮，安全帶回 🦴'+got+'。')}
function showModal(i,t,x){mIcon.textContent=i;mTitle.textContent=t;mText.textContent=x;overlay.classList.add('show')}function closeModal(){overlay.classList.remove('show');restart()}
function render(){hp.textContent=Math.max(0,D.hp)+' / '+D.max;floor.textContent=D.floor+'F';lootHud.textContent='🦴'+D.loot;turn.textContent=D.turn;best.textContent=G.best+'F';bank.textContent='🦴'+G.bank;let th=THEMES[Math.floor((D.floor-1)/5)%THEMES.length];floorName.textContent=th[0];status.textContent=D.floor%5===0?'BOSS':'SWIPE';board.innerHTML=D.b.map((o,i)=>{if(!o)return'<div class="cell"></div>';let cls=o.t==='p'?'player':o.t==='e'?'enemy':o.t==='boss'?'boss':o.t==='loot'?'loot':'exit',emo=o.t==='p'?'🧙':o.t==='e'?'👺':o.t==='boss'?'👑':o.t==='loot'?'🦴':'⬇️',num=(o.t==='e'||o.t==='boss')?'<span class="num">'+o.v+'<\/span>':'';return'<div class="cell '+cls+' '+(fx.merge===i?'merge ':'')+(fx.hit===i?'hit ':'')+(fx.spawn?'spawn ':'')+'"><span class="unit">'+emo+'</span>'+num+'</div>'}).join('');fx={}}
let sx=0,sy=0;board.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});board.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;swipe(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))});
document.addEventListener('keydown',e=>{let m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R'};if(m[e.key]){e.preventDefault();swipe(m[e.key])}});
restart();
</script></body></html>
