<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>1024 RPG Version 2 v0.1</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#101419;color:#eef3f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}body{display:flex;justify-content:center}.app{width:min(96vw,600px);padding:calc(env(safe-area-inset-top) + 12px) 14px 30px}a{color:#9da9b5;text-decoration:none;font-weight:800}.top{display:flex;justify-content:space-between;gap:10px;margin-top:10px}.top h1{font-size:27px;margin:0}.sub{font-size:11px;color:#e7bd70;margin-top:5px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;min-width:230px}.stat{background:#1a2027;border:1px solid #2a323b;border-radius:9px;padding:6px;text-align:center}.stat span{display:block;font-size:8px;color:#7f8b96;font-weight:900}.stat b{font-size:14px}.bar{display:flex;justify-content:space-between;align-items:center;margin:12px 0 8px}button{border:0;border-radius:10px;background:#2c3743;color:#fff;padding:9px 11px;font-weight:900}.log{background:#171c22;border:1px solid #272f37;border-radius:11px;padding:8px 10px;margin-bottom:8px;min-height:35px;font-size:11px;color:#b8c3cd}.skillbar{background:#171c22;border:1px solid #343b43;border-radius:12px;padding:8px 9px;margin-bottom:9px}.skillbar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.skillbar-head b{font-size:11px}.skillbar-head span{font-size:9px;color:#7f8b96}.skill-icons{display:flex;gap:6px;overflow-x:auto;min-height:42px}.skill-icon{flex:0 0 42px;width:42px;height:42px;border:1px solid #4a5360;background:#202730;border-radius:10px;font-size:21px;display:flex;align-items:center;justify-content:center;padding:0}.empty-skills{font-size:10px;color:#66727d;display:flex;align-items:center}.board{position:relative;width:min(91vw,520px);aspect-ratio:1;margin:auto;background:#252d35;border-radius:18px;padding:10px;touch-action:none;user-select:none;overflow:hidden}.grid{position:absolute;inset:10px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px}.cell{background:#151a20;border:1px solid #303944;border-radius:12px}.pieces,.effects{position:absolute;inset:10px}.effects{pointer-events:none;z-index:5}.piece,.moveghost,.mergefx{position:absolute;width:calc((100% - 24px)/4);height:calc((100% - 24px)/4);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 4px 14px #0003}.moveghost{z-index:15;transition:transform .25s cubic-bezier(.22,.8,.24,1)}.piece.hideForMove{opacity:0}.mergefx{z-index:14;background:#68717f;animation:mergePulse .25s ease-out forwards}.heroNum{font-size:42px;line-height:1;font-weight:950}.tier,.name{font-size:10px}.heroUnit{background:#4a4f5a}.enemy{background:#5c3138}.boss{background:#7a3030}.icon{font-size:24px}@keyframes mergePulse{0%{opacity:.3;scale:.65}50%{opacity:1;scale:1.15}100%{opacity:0;scale:1}}.damagefx{position:absolute;width:calc((100% - 24px)/4);height:calc((100% - 24px)/4);display:flex;align-items:flex-start;justify-content:center;padding-top:12px;z-index:18;font-size:18px;font-weight:1000;color:#ffdddd;text-shadow:0 2px 5px #000;animation:damageFloat .75s ease-out forwards}@keyframes damageFloat{0%{opacity:0;translate:0 10px}20%{opacity:1}100%{opacity:0;translate:0 -12px}}.rules{margin:10px auto 0;max-width:520px;background:#171d23;border:1px solid #28313a;border-radius:10px;padding:11px;font-size:10px;color:#9aa7b2;line-height:1.5}.rules b{color:#fff}.modal{position:fixed;inset:0;background:#090d12ee;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.panel{width:min(92vw,480px);max-height:88vh;overflow:auto;background:#171d23;border:1px solid #39434d;border-radius:18px;padding:18px}.panel h2{text-align:center;margin:2px 0 5px}.panel .lead{text-align:center;color:#9da9b5;font-size:12px;margin-bottom:14px}.choices{display:grid;gap:9px}.choice{width:100%;text-align:left;background:#202730;border:1px solid #3a4652;border-radius:14px;padding:13px;color:#eef3f7}.choice strong{display:block;font-size:15px;margin-bottom:5px}.choice span{font-size:11px;color:#adb7c1;line-height:1.5}.choice .emoji{font-size:24px;float:left;margin-right:10px}.detail{text-align:center}.detail .big{font-size:48px}.detail h2{margin:6px 0}.detail p{color:#adb7c1;line-height:1.65}.close{width:100%;margin-top:12px;background:#343e48}.gameover{text-align:center}.gameover .score{font-size:45px;color:#ffe09a;font-weight:1000}.gameover p{color:#adb7c1}</style></head><body><div class="app"><a href="../type-01-v2/">← Version 2</a><div class="top"><div><h1>1024 RPG</h1><div class="sub">VERSION 2 · v0.1</div></div><div class="stats"><div class="stat"><span>SCORE</span><b id="score">0</b></div><div class="stat"><span>TURN</span><b id="turn">0</b></div><div class="stat"><span>MERGE</span><b id="merges">0</b></div><div class="stat"><span>BEST HERO</span><b id="best">1</b></div></div></div><div class="bar"><button id="restart">重新開始</button><div style="font-size:10px;color:#8996a2;text-align:right">新最高數字<br>技能三選一</div></div><div class="log" id="log">合出第一個 2，開始建立這一局的技能 Build。</div><section class="skillbar"><div class="skillbar-head"><b>本局技能</b><span>點擊圖示查看效果</span></div><div class="skill-icons" id="skillIcons"><div class="empty-skills">尚未取得技能</div></div></section><div class="board" id="board"><div class="grid" id="grid"></div><div class="pieces" id="pieces"></div><div class="effects" id="effects"></div></div><div class="rules"><b>Version 2 v0.1：</b>取消 Version 1 的戰士／弓箭手／法師固定合併技能。每當首次合出比歷史最高值更大的英雄數字（2、4、8、16…），遊戲暫停並從技能池隨機提供 3 個未取得技能，選 1 個後全局共享。其餘 4×4、移動、HP、敵人、Boss、生成與計分基礎規則沿用 Version 1。</div></div><div class="modal" id="modal"><div class="panel" id="panel"></div></div><script>(function(){const N=4,BOSS_INTERVAL=20,MOVE_MS=250,MERGE_MS=250,DAMAGE_MS=750;const grid=document.getElementById('grid'),pieces=document.getElementById('pieces'),effects=document.getElementById('effects'),board=document.getElementById('board'),logEl=document.getElementById('log'),modal=document.getElementById('modal'),panel=document.getElementById('panel'),skillIcons=document.getElementById('skillIcons');for(let i=0;i<16;i++){let d=document.createElement('div');d.className='cell';grid.appendChild(d)}const SKILLS=[{id:'swift',icon:'⚡',name:'疾行',desc:'每 5 次有效移動，隨機 1 名敵人受到 1 傷害。',trigger:'move'},{id:'wind',icon:'🌪️',name:'風壓',desc:'一次滑動移動至少 3 名英雄時，隨機 1 名敵人受到 1 傷害。',trigger:'move'},{id:'momentum',icon:'👣',name:'餘勢',desc:'連續 3 回合沒有合併，第 3 回合所有英雄恢復 1 HP。',trigger:'move'},{id:'resonance',icon:'💥',name:'共鳴',desc:'每 3 次合併，所有敵人受到 1 傷害。',trigger:'merge'},{id:'fusionHeal',icon:'🌱',name:'融合再生',desc:'合併完成後，新英雄恢復 1 HP。',trigger:'merge'},{id:'overload',icon:'✨',name:'超載',desc:'同一次滑動發生 2 次以上合併，所有敵人受到 1 傷害。',trigger:'merge'},{id:'thorns',icon:'🛡️',name:'反震',desc:'英雄受到敵人攻擊時，攻擊者受到 1 傷害。',trigger:'hurt'},{id:'adversity',icon:'🩸',name:'逆境',desc:'英雄 HP 首次降到一半以下時，隨機敵人受到 1 傷害。',trigger:'hurt'},{id:'rage',icon:'🔥',name:'怒火',desc:'每累積承受 5 HP 傷害，下一次技能傷害 +1。',trigger:'hurt'},{id:'deathBlast',icon:'💣',name:'遺爆',desc:'英雄死亡時，周圍 8 格敵人受到 1 傷害。',trigger:'heroDeath'},{id:'legacy',icon:'👻',name:'遺志',desc:'英雄死亡後，下一次合併會額外對隨機敵人造成 1 傷害。',trigger:'heroDeath'},{id:'blood',icon:'🩸',name:'血祭',desc:'英雄死亡後，下一次技能傷害 +1。',trigger:'heroDeath'},{id:'harvest',icon:'🌑',name:'靈魂收割',desc:'每擊殺 3 名敵人，隨機英雄恢復 1 HP。',trigger:'enemyDeath'},{id:'chainKill',icon:'⚔️',name:'連殺',desc:'同一回合擊殺 2 名以上敵人時，再隨機攻擊 1 名敵人。',trigger:'enemyDeath'},{id:'killingIntent',icon:'🔴',name:'殺意',desc:'每累積擊殺 5 名敵人，下一次技能傷害 +1。',trigger:'enemyDeath'},{id:'prepare',icon:'✨',name:'決戰準備',desc:'Boss 出現時，所有英雄恢復 1 HP。',trigger:'boss'},{id:'firstStrike',icon:'⚡',name:'先制',desc:'Boss 出現時立即受到 2 傷害。',trigger:'boss'},{id:'fortress',icon:'🏰',name:'堡壘',desc:'Boss 出現後前 3 回合，英雄受到的傷害 -1。',trigger:'boss'},{id:'reinforce',icon:'🌟',name:'優質增援',desc:'每生成 5 名英雄，第 5 名直接以數字 2 出現。',trigger:'spawn'},{id:'newborn',icon:'❤️',name:'新生',desc:'新生成英雄第一次受到傷害時，傷害 -1。',trigger:'spawn'},{id:'mutation',icon:'🎲',name:'突變',desc:'新英雄有 10% 機率直接生成數字 2。',trigger:'spawn'},{id:'lone',icon:'🐺',name:'孤軍',desc:'場上英雄 ≤3 時，技能造成的傷害 +1。',trigger:'board'},{id:'crowd',icon:'🧱',name:'人海',desc:'場上英雄 ≥6 時，每 5 回合隨機英雄恢復 1 HP。',trigger:'board'},{id:'crisis',icon:'🚨',name:'危機感知',desc:'棋盤空格 ≤3 時，每次合併額外恢復該英雄 1 HP。',trigger:'board'},{id:'breaker',icon:'👑',name:'突破者',desc:'每次創造新的最高英雄數字，額外獲得該數字 ×5 Score。',trigger:'score'},{id:'bossHunter',icon:'🏆',name:'獵王',desc:'擊敗 Boss 的分數由 +100 提升為 +150。',trigger:'score'},{id:'risk',icon:'💎',name:'高風險投資',desc:'敵人擊殺分數 ×2，但英雄死亡扣分也 ×2。',trigger:'score'}];let E=[],turn=0,mergeCount=0,id=1,touch=null,ended=false,busy=false,score=0,moveCount=0,highestTile=1,bossLevel=1,bossDefeated=0,nextBossTurn=20,bossActive=false,heroSpawnCount=0,noMergeTurns=0,totalDamageTaken=0,skillBoost=0,pendingLegacy=false,bossShieldUntil=-1,selected=[];const wait=ms=>new Promise(r=>setTimeout(r,ms)),rand=a=>a[Math.floor(Math.random()*a.length)],has=x=>selected.includes(x),bossMax=()=>10+(bossLevel-1)*5,enemyDamage=()=>Math.ceil((bossDefeated+1)/2),bossDamage=()=>Math.ceil(bossLevel/2);function empty(){let u=new Set(E.map(x=>x.r+','+x.c)),a=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!u.has(r+','+c))a.push([r,c]);return a}function heroValue(e){return(e.tier||2)/2}function maxHP(e){return e.type==='hero'?e.tier:e.maxHits}function rem(e){return Math.max(0,maxHP(e)-(e.hits||0))}function addHero(){let a=empty();if(!a.length)return false;heroSpawnCount++;let tier=2;if(has('reinforce')&&heroSpawnCount%5===0)tier=4;else if(has('mutation')&&Math.random()<.1)tier=4;let[r,c]=rand(a);E.push({id:id++,type:'hero',tier,r,c,hits:0,newborn:true});return true}function addEnemy(boss=false){let a=empty();if(!a.length)return false;let[r,c]=rand(a);E.push({id:id++,type:boss?'boss':'enemy',r,c,hits:0,maxHits:boss?bossMax():1,damage:boss?bossDamage():enemyDamage()});return true}function at(r,c,skip,list=E){return list.find(x=>x.id!==skip&&x.r===r&&x.c===c)}function step(){return(pieces.clientWidth-24)/4+8}function cls(e){return e.type==='hero'?'heroUnit':e.type==='boss'?'boss':'enemy'}function inner(e){if(e.type==='hero')return '<div class="heroNum">'+heroValue(e)+'</div><div class="tier">'+rem(e)+' HP</div>';return '<div class="icon">'+(e.type==='boss'?'👑':'🥷')+'</div><div class="name">'+(e.type==='boss'?'Boss':'暗影刺客')+'</div><div class="tier">'+rem(e)+' HP · ATK '+e.damage+'</div>'}function renderSkills(){skillIcons.innerHTML='';if(!selected.length){skillIcons.innerHTML='<div class="empty-skills">尚未取得技能</div>';return}for(let sid of selected){let s=SKILLS.find(x=>x.id===sid),b=document.createElement('button');b.className='skill-icon';b.textContent=s.icon;b.title=s.name;b.onclick=()=>showDetail(s);skillIcons.appendChild(b)}}function render(){pieces.innerHTML='';let s=step();for(let e of E){let d=document.createElement('div');d.className='piece '+cls(e);d.dataset.id=e.id;d.style.transform='translate('+(e.c*s)+'px,'+(e.r*s)+'px)';d.innerHTML=inner(e);pieces.appendChild(d)}scoreEl.textContent=score;turnEl.textContent=turn;mergesEl.textContent=mergeCount;bestEl.textContent=highestTile;renderSkills()}const scoreEl=document.getElementById('score'),turnEl=document.getElementById('turn'),mergesEl=document.getElementById('merges'),bestEl=document.getElementById('best');function showDetail(s){panel.innerHTML='<div class="detail"><div class="big">'+s.icon+'</div><h2>'+s.name+'</h2><p>'+s.desc+'</p><button class="close">關閉</button></div>';modal.classList.add('show');panel.querySelector('.close').onclick=()=>modal.classList.remove('show')}function chooseSkill(value){return new Promise(resolve=>{let pool=SKILLS.filter(s=>!selected.includes(s.id)),opts=[];while(pool.length&&opts.length<3){let i=Math.floor(Math.random()*pool.length);opts.push(pool.splice(i,1)[0])}panel.innerHTML='<h2>NEW HERO '+value+'</h2><div class="lead">突破新的最高數字 · 選擇 1 個全局技能</div><div class="choices">'+opts.map(s=>'<button class="choice" data-id="'+s.id+'"><span class="emoji">'+s.icon+'</span><strong>'+s.name+'</strong><span>'+s.desc+'</span></button>').join('')+'</div>';modal.classList.add('show');panel.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{selected.push(b.dataset.id);modal.classList.remove('show');renderSkills();logEl.textContent='取得技能：'+SKILLS.find(s=>s.id===b.dataset.id).name;resolve()})})}function heal(e,n=1){if(e&&e.type==='hero')e.hits=Math.max(0,(e.hits||0)-n)}function skillDamage(){let d=1+(has('lone')&&E.filter(x=>x.type==='hero').length<=3?1:0)+skillBoost;skillBoost=0;return d}function damageEnemy(e,n){if(!e||e.type==='hero')return false;e.hits+=Math.min(n,rem(e));return e.hits>=e.maxHits}function damageHero(h,n,attacker){if(!h)return;let dmg=n;if(has('fortress')&&turn<=bossShieldUntil)dmg=Math.max(0,dmg-1);if(has('newborn')&&h.newborn){dmg=Math.max(0,dmg-1);h.newborn=false}h.hits+=Math.min(dmg,rem(h));totalDamageTaken+=dmg;if(has('rage')&&totalDamageTaken>=5){totalDamageTaken-=5;skillBoost++}if(has('thorns')&&attacker)damageEnemy(attacker,1);if(has('adversity')&&!h.adversity&&rem(h)<=h.tier/2){h.adversity=true;let es=E.filter(x=>x.type!=='hero');if(es.length)damageEnemy(rand(es),skillDamage())}}function cleanup(){let dead=E.filter(e=>rem(e)<=0),enemyKills=0;for(let e of dead){if(e.type==='hero'){let loss=Math.min(score,heroValue(e)*(has('risk')?2:1));score-=loss;if(has('deathBlast'))for(let q of E.filter(x=>x.type!=='hero'&&Math.abs(x.r-e.r)<=1&&Math.abs(x.c-e.c)<=1))damageEnemy(q,skillDamage());if(has('legacy'))pendingLegacy=true;if(has('blood'))skillBoost++}else{enemyKills++;score+=e.type==='boss'?(has('bossHunter')?150:100):(has('risk')?40:20);if(e.type==='boss'){bossDefeated++;bossLevel++;bossActive=false;nextBossTurn=turn+BOSS_INTERVAL}}}E=E.filter(e=>rem(e)>0);if(enemyKills&&has('harvest')&&bossDefeated+enemyKills>=3){let hs=E.filter(x=>x.type==='hero');if(hs.length)heal(rand(hs))}if(enemyKills&&has('killingIntent')&&(bossDefeated+enemyKills)%5===0)skillBoost++;if(enemyKills>=2&&has('chainKill')){let es=E.filter(x=>x.type!=='hero');if(es.length)damageEnemy(rand(es),skillDamage())}}function moveRecord(e,fr,fc,tr,tc){return{id:e.id,fromR:fr,fromC:fc,toR:tr,toC:tc,cls:cls(e),html:inner(e)}}async function animateMoves(ms){if(!ms.length)return;let s=step();for(let m of ms){let base=pieces.querySelector('[data-id="'+m.id+'"]');if(base)base.classList.add('hideForMove');let g=document.createElement('div');g.className='moveghost '+m.cls;g.innerHTML=m.html;g.style.transform='translate('+(m.fromC*s)+'px,'+(m.fromR*s)+'px)';effects.appendChild(g);m.el=g}requestAnimationFrame(()=>requestAnimationFrame(()=>ms.forEach(m=>m.el.style.transform='translate('+(m.toC*s)+'px,'+(m.toR*s)+'px)')));await wait(MOVE_MS);ms.forEach(m=>m.el.remove())}function plan(dir){let list=JSON.parse(JSON.stringify(E)),before=JSON.stringify(list.map(x=>[x.id,x.r,x.c,x.tier])),hs=list.filter(x=>x.type==='hero'),dr=dir==='up'?-1:dir==='down'?1:0,dc=dir==='left'?-1:dir==='right'?1:0;hs.sort((a,b)=>dir==='left'?a.c-b.c:dir==='right'?b.c-a.c:dir==='up'?a.r-b.r:b.r-a.r);let merged=new Set,mergeIds=[],moves=[],contacts=[];for(let h of hs){if(!list.some(x=>x.id===h.id))continue;let sr=h.r,sc=h.c;while(true){let nr=h.r+dr,nc=h.c+dc;if(nr<0||nr>=N||nc<0||nc>=N)break;let o=at(nr,nc,h.id,list);if(!o){h.r=nr;h.c=nc;continue}if(o.type==='hero'&&o.tier===h.tier&&!merged.has(o.id)){let nt=o.tier*2,remain=Math.min(nt,rem(o)+rem(h));moves.push(moveRecord(h,sr,sc,o.r,o.c));o.tier=nt;o.hits=nt-remain;list=list.filter(x=>x.id!==h.id);merged.add(o.id);mergeIds.push(o.id);break}if(o.type!=='hero')contacts.push({heroId:h.id,enemyId:o.id});break}if(list.some(x=>x.id===h.id)&&(sr!==h.r||sc!==h.c))moves.push(moveRecord(h,sr,sc,h.r,h.c))}return{changed:contacts.length||before!==JSON.stringify(list.map(x=>[x.id,x.r,x.c,x.tier])),list,moves,mergeIds,contacts}}function canMove(){return['left','right','up','down'].some(d=>plan(d).changed)}async function processMergeSkills(mergeIds,movedHeroes){let newRecords=[];for(let mid of mergeIds){let h=E.find(x=>x.id===mid);if(!h)continue;mergeCount++;let v=heroValue(h);score+=v;if(has('fusionHeal'))heal(h);if(has('crisis')&&empty().length<=3)heal(h);if(has('resonance')&&mergeCount%3===0)E.filter(x=>x.type!=='hero').forEach(e=>damageEnemy(e,skillDamage()));if(pendingLegacy){let es=E.filter(x=>x.type!=='hero');if(es.length)damageEnemy(rand(es),skillDamage());pendingLegacy=false}if(v>highestTile){highestTile=v;if(has('breaker'))score+=v*5;newRecords.push(v)}}if(has('overload')&&mergeIds.length>=2)E.filter(x=>x.type!=='hero').forEach(e=>damageEnemy(e,skillDamage()));if(has('wind')&&movedHeroes>=3){let es=E.filter(x=>x.type!=='hero');if(es.length)damageEnemy(rand(es),skillDamage())}cleanup();render();for(let v of newRecords)await chooseSkill(v)}function enemyPhase(){for(let e of E.filter(x=>x.type!=='hero')){let adj=E.find(h=>h.type==='hero'&&Math.abs(h.r-e.r)+Math.abs(h.c-e.c)===1);if(adj){damageHero(adj,e.damage,e);continue}let hs=E.filter(x=>x.type==='hero');if(!hs.length)break;hs.sort((a,b)=>(Math.abs(a.r-e.r)+Math.abs(a.c-e.c))-(Math.abs(b.r-e.r)+Math.abs(b.c-e.c)));let h=hs[0],opts=[[Math.sign(h.r-e.r),0],[0,Math.sign(h.c-e.c)]];for(let[rr,cc]of opts){let nr=e.r+rr,nc=e.c+cc;if((rr||cc)&&nr>=0&&nr<N&&nc>=0&&nc<N&&!at(nr,nc,e.id)){e.r=nr;e.c=nc;break}}}cleanup()}async function move(d){if(ended||busy||modal.classList.contains('show'))return;let p=plan(d);if(!p.changed){check();return}busy=true;moveCount++;score++;await animateMoves(p.moves);E=p.list;for(let c of p.contacts){let h=E.find(x=>x.id===c.heroId),en=E.find(x=>x.id===c.enemyId);if(h&&en)damageHero(h,en.damage,en)}if(has('swift')&&moveCount%5===0){let es=E.filter(x=>x.type!=='hero');if(es.length)damageEnemy(rand(es),skillDamage())}for(let mid of p.mergeIds){let h=E.find(x=>x.id===mid);if(h){let d=document.createElement('div'),s=step();d.className='mergefx';d.style.transform='translate('+(h.c*s)+'px,'+(h.r*s)+'px)';effects.appendChild(d);setTimeout(()=>d.remove(),MERGE_MS)}}await wait(p.mergeIds.length?MERGE_MS:0);await processMergeSkills(p.mergeIds,p.moves.length);noMergeTurns=p.mergeIds.length?0:noMergeTurns+1;if(has('momentum')&&noMergeTurns>=3){E.filter(x=>x.type==='hero').forEach(h=>heal(h));noMergeTurns=0}turn++;enemyPhase();if(has('crowd')&&E.filter(x=>x.type==='hero').length>=6&&turn%5===0){let hs=E.filter(x=>x.type==='hero');if(hs.length)heal(rand(hs))}if(turn%2===0)addEnemy(false);addHero();if(turn>=nextBossTurn&&!bossActive&&addEnemy(true)){bossActive=true;if(has('prepare'))E.filter(x=>x.type==='hero').forEach(h=>heal(h));let b=E.find(x=>x.type==='boss');if(has('firstStrike'))damageEnemy(b,2);if(has('fortress'))bossShieldUntil=turn+2;cleanup();logEl.textContent='Boss 登場。'}render();check();busy=false}function check(){if(!E.some(x=>x.type==='hero'))return end('隊伍全滅');if(!canMove())return end('無法移動')}function end(t){if(ended)return;ended=true;panel.innerHTML='<div class="gameover"><h2>'+t+'</h2><div class="score">'+score+'</div><p>最高英雄 '+highestTile+' · 合併 '+mergeCount+' 次 · 已取得 '+selected.length+' 個技能</p><button id="again">再玩一次</button></div>';modal.classList.add('show');document.getElementById('again').onclick=reset}function reset(){E=[];turn=0;mergeCount=0;id=1;ended=false;busy=false;score=0;moveCount=0;highestTile=1;bossLevel=1;bossDefeated=0;nextBossTurn=20;bossActive=false;heroSpawnCount=0;noMergeTurns=0;totalDamageTaken=0;skillBoost=0;pendingLegacy=false;bossShieldUntil=-1;selected=[];modal.classList.remove('show');addHero();addHero();addHero();logEl.textContent='合出第一個 2，開始建立這一局的技能 Build。';render()}board.addEventListener('touchstart',e=>{if(busy)return;let t=e.changedTouches[0];touch=[t.clientX,t.clientY]},{passive:true});board.addEventListener('touchend',e=>{if(!touch||busy)return;let t=e.changedTouches[0],dx=t.clientX-touch[0],dy=t.clientY-touch[1];touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});window.addEventListener('keydown',e=>{let m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};if(m[e.key]){e.preventDefault();move(m[e.key])}});document.getElementById('restart').onclick=reset;reset()})();</script></body></html>
