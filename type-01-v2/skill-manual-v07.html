<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>1024 RPG · v0.7 技能說明書</title><style>html,body{margin:0;background:#101216;color:#f2f4f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}.loading{padding:32px;color:#aeb8c2}.boss-manual{width:min(94vw,960px);margin:0 auto 60px;padding:0 16px}.boss-manual h2{border-bottom:1px solid #343b44;padding-bottom:10px}.boss-card{background:#191d22;border:1px solid #665a3b;border-radius:18px;padding:18px;margin:12px 0}.boss-card h3{margin:0 0 8px}.boss-card p{color:#b9c2cb;line-height:1.65;margin:7px 0}.boss-tag{display:inline-block;color:#e7bd70;border:1px solid #665a3b;border-radius:999px;padding:4px 8px;font-size:11px;margin-bottom:8px}</style></head><body><div class="loading">載入 v0.7 技能說明書…</div><script>(async()=>{try{let h=await fetch('https://raw.githubusercontent.com/JohnnyMilk/1024-rpg/0908ab0c23d1e0f8f7cdd06bd20ea137c10113f7/type-01-v2/skill-manual-v07.html').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});const R=[['TYPE 01 · VERSION 2 · v0.7 ACTIVE','TYPE 01 · VERSION 2 · v0.7 · B36'],['特殊戰士接觸敵人時，對接觸敵人造成 1 點傷害。','【觸發：進場】特殊戰士每次實際進入棋盤時檢查周圍 8 格；若有敵人與戰士相鄰，立即對接觸的敵人造成 1 點傷害。這不是移動技能；單純滑動不會觸發迎戰。'],['特殊戰士實際移動後接觸敵人時發動近戰攻擊。','【觸發：實際移動】特殊戰士必須在玩家一次有效滑動中真的改變所在格；移動結束後，若周圍 8 格內有敵人，立即發動近戰攻擊。戰士沒有改變格位時不觸發。'],['遊俠實際移動後，有 50% 機率對周圍 8 格以外最遠敵人造成 1 點傷害。','【觸發：實際移動＋35% 機率】特殊遊俠必須在玩家一次有效滑動中真的改變所在格。移動結束後進行一次 35% 判定；成功時，只從遊俠周圍 8 格以外的敵人中選擇距離最遠的 1 名，造成 1 點傷害。周圍 8 格內的敵人不能成為遠射目標；沒有實際移動或機率判定失敗都不觸發。'],['遊俠移動後向反方向射擊，攻擊該方向第一個敵人。','【觸發：實際移動】特殊遊俠必須真的改變格位。移動結束後，沿「本次滑動方向的反方向」直線射擊；若該直線上有敵人，命中距離遊俠最近的第 1 名敵人。沒有實際移動，或反方向直線上沒有敵人時不觸發。'],['特殊祭司進場時，治療周圍 8 格我方單位 1 HP。','【觸發：進場】特殊祭司每次實際進入棋盤時觸發治癒波，治療祭司周圍 8 格內仍存活的友方單位 1 HP，不包含祭司自己。這不是移動技能；單純滑動不會觸發治癒波。'],['祭司實際移動後，從自己周圍 8 格內的友方單位中隨機選擇最多 3 名獲得守護，不包含祭司自己；優先選擇目前沒有守護的友方。守護在下一次受到傷害時使傷害 -1，之後消耗。重新取得守護不會先觸發減傷。','【觸發：實際移動】特殊祭司必須在玩家一次有效滑動中真的改變所在格。移動結束後，從祭司周圍 8 格內仍存活的友方單位中隨機選擇最多 3 名獲得守護，不包含祭司自己；優先選擇目前沒有守護的友方。守護使該單位下一次受到的傷害 -1，減傷後守護消耗。祭司沒有實際移動時不觸發。']];for(const [a,b] of R)h=h.split(a).join(b);const boss=`<section class="boss-manual" id="boss"><h2>Boss · 巨像守衛</h2><div class="boss-card"><span class="boss-tag">🗿 BOSS · 守門型</span><h3>🗿 巨像守衛</h3><p>巨像守衛登場時，戰場由 4×4 擴張為 4×6。Boss 初始 HP 為 10；同一局中每擊敗 1 隻 Boss，下一隻 Boss 最大 HP 增加 5，依序為 10 → 15 → 20 → 25…。</p><p>行動時依技能條件與冷卻狀態使用衝陣、震地或踐踏。Boss 被擊敗後，擴張區域會逐排進入警告並崩落，最後戰場恢復為 4×4。</p></div><div class="boss-card"><h3>🐘 衝陣 · CD 1</h3><p>當巨像守衛與英雄位於同一直行或直列，且路徑可衝撞時發動。巨像守衛最多向目標方向衝 2 格；撞擊造成 1 點傷害並強制推動。若單位因此被推出棋盤，會直接淡出並移除。</p></div><div class="boss-card"><h3>💥 震地 · CD 4</h3><p>巨像守衛周圍 8 格內存在英雄時可發動；範圍內所有英雄受到 2 點傷害。</p></div><div class="boss-card"><h3>🗿 踐踏 · 無 CD</h3><p>沒有其他可發動技能時的普通行動。巨像守衛朝最近的英雄逼近；接觸攻擊造成 2 點傷害。</p></div><div class="boss-card"><h3>🏛️ 戰場擴張</h3><p>巨像守衛進場時，戰場由 4×4 擴張為 4×6，提供 Boss 戰專用的額外戰場空間。</p></div><div class="boss-card"><h3>⚠️ 戰場崩落</h3><p>巨像守衛被擊敗後，擴張的棋盤會逐排顯示警告。玩家仍有警告階段可行動，之後該排崩落；流程持續至戰場恢復為 4×4。</p></div></section>`;h=h.replace('</main>',boss+'</main>');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div class="loading">技能說明書載入失敗：'+String(e.message||e)+'</div>'}})();</script></body></html>
