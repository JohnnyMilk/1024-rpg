<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>1024 RPG · Version 2 技能說明書</title><style>*{box-sizing:border-box}body{margin:0;background:#101216;color:#f2f4f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}.wrap{width:min(94vw,960px);margin:auto;padding:30px 16px 60px}a{color:inherit;text-decoration:none}.back{color:#a8b2bc;font-weight:800}.hero{padding:28px 0 10px}.eyebrow{font-size:12px;letter-spacing:.16em;color:#e7bd70;font-weight:900}.hero h1{font-size:clamp(36px,8vw,58px);margin:8px 0 12px;line-height:1}.hero p,.note{color:#aeb8c2;line-height:1.7}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0 18px;position:sticky;top:0;background:#101216;z-index:2}.tabs a{white-space:nowrap;border:1px solid #343b44;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:800}.group{margin-top:28px;scroll-margin-top:75px}.group h2{border-bottom:1px solid #343b44;padding-bottom:10px}.skill{background:#191d22;border:1px solid #2b323a;border-radius:18px;padding:18px;margin:12px 0}.skill h3{margin:0 0 12px;font-size:19px}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.lv{background:#121519;border-radius:12px;padding:11px;line-height:1.55;font-size:13px;color:#b9c2cb}.lv b{display:block;color:#e7bd70;margin-bottom:5px}.fixed{color:#b9c2cb;line-height:1.6}.tag{display:inline-block;color:#e7bd70;border:1px solid #665a3b;border-radius:999px;padding:4px 8px;font-size:11px;margin-bottom:8px}@media(max-width:700px){.levels{grid-template-columns:1fr}.wrap{width:100%;padding-left:17px;padding-right:17px}}</style></head><body><main class="wrap"><a class="back" href="./">← Version 2</a><section class="hero"><div class="eyebrow">TYPE 01 · VERSION 2 · SKILL MANUAL</div><h1>技能說明書</h1><p>完整公開 Version 2 技能能力與熟練度變化。遊戲內的「三選一」、「本局技能」與「遊戲歷程」只顯示玩家目前已解鎖等級；本頁則作為完整說明書，方便查閱 LV1～MAX。</p><p class="note">熟練度：LV1＝0–29 次、LV2＝30–59 次、LV3＝60–89 次、MAX＝90 次以上。職業基礎能力與特殊共用技能目前為固定能力，不使用熟練度等級。</p></section><nav class="tabs"><a href="#base">職業基礎</a><a href="#warrior">戰士</a><a href="#ranger">遊俠</a><a href="#priest">祭司</a><a href="#common">特殊共用</a><a href="#general">一般技能</a></nav><div id="content"></div></main><script>
const mastery={
'橫掃':['隨機攻擊 1 個有效方向。','隨機攻擊 2 個有效方向。','隨機攻擊 3 個有效方向。','攻擊周圍 8 格全部敵人。'],'衝擊':['移動至少 2 格後，隨機攻擊周圍最多 1 名敵人。','移動至少 2 格後，隨機攻擊周圍最多 2 名敵人。','移動至少 2 格後，隨機攻擊周圍最多 3 名敵人。','移動至少 2 格後，隨機攻擊周圍最多 4 名敵人。'],'重擊':['合併後攻擊相鄰十字 4 格。','合併後攻擊十字方向並延伸至棋盤邊界。','合併後攻擊延伸十字與相鄰 4 個斜角。','合併後攻擊全場所有敵人。'],
'狙擊':['遠射觸發時，攻擊符合距離條件的最遠 2 名敵人。','遠射觸發時，攻擊符合距離條件的最遠 3 名敵人。','遠射觸發時，攻擊符合距離條件的最遠 4 名敵人。','遠射觸發時解除距離限制，隨機攻擊全場最多 3 名敵人。'],'迅捷射擊':['移動至少 2 格時額外觸發 1 次遠射。','移動至少 2 格時額外觸發 2 次遠射。','移動至少 2 格時額外觸發 3 次遠射。','任何實際移動都額外觸發 3 次遠射。'],'箭雨':['合併後，從周圍 8 格以外隨機攻擊最多 2 名敵人。','合併後，從周圍 8 格以外隨機攻擊最多 3 名敵人。','合併後，從周圍 8 格以外隨機攻擊最多 4 名敵人。','合併後攻擊全場所有敵人。'],
'聖療':['治癒波改為全場友方恢復 1 HP。','治癒波改為全場友方恢復 2 HP。','治癒波改為全場友方恢復 3 HP。','治癒波改為全場友方恢復 3 HP，並使全場友方獲得守護。'],'復甦':['周圍 8 格內友方死亡時，以 1 HP 原地復活一次。','周圍 8 格內友方死亡時，以 2 HP 原地復活一次。','周圍 8 格內友方死亡時，以 3 HP 原地復活一次。','周圍 8 格內友方以 3 HP 原地復活一次；範圍內死亡敵人轉為數字 8、HP 3 的普通我方英雄。'],'懲戒':['守護成功減傷時，對攻擊者反擊 1 點傷害。','反擊攻擊者 1 點傷害，並有 20% 機率保留守護。','有 20% 機率保留守護，並依攻擊方向攻擊該側 3 格敵人。','有 20% 機率保留守護，並對被攻擊友方周圍 8 格敵人造成傷害。'],
'疾行':['每 5 次有效移動，下一個 Enemy Phase 不生成普通敵人。','每 4 次有效移動，下一個 Enemy Phase 不生成普通敵人。','每 3 次有效移動，下一個 Enemy Phase 不生成普通敵人。','每 3 次有效移動觸發；該 Enemy Phase 不生成普通敵人，且所有普通敵人跳過行動。'],'風壓':['一次滑動實際移動至少 4 名英雄，隨機 1 名敵人受到 1 傷害。','一次滑動實際移動至少 4 名英雄，隨機 2 名敵人各受 1 傷害。','一次滑動實際移動至少 3 名英雄，隨機 2 名敵人各受 1 傷害。','一次滑動實際移動至少 3 名英雄，全場敵人各受 1 傷害。'],'餘勢':['連續 3 回合沒有合併，全體友方恢復 1 HP。','連續 3 回合沒有合併，全體友方恢復 2 HP。','連續 3 回合沒有合併，全體友方恢復 3 HP。','連續 3 回合沒有合併，全體友方恢復 3 HP 並獲得守護。'],'波動共鳴':['敵人死亡時，在死亡位置周圍 8 格內隨機 1 名敵人受到 1 傷害；本次波動不會連鎖。','敵人死亡時，在死亡位置周圍 8 格內隨機 2 名不同敵人各受到 1 傷害；本次波動不會連鎖。','敵人死亡時，死亡位置周圍 8 格內全部敵人各受到 1 傷害；本次波動不會連鎖。','敵人死亡時，死亡位置周圍 8 格內全部敵人各受到 1 傷害；被波動擊殺的敵人會繼續觸發波動。'],'超載':['同一次滑動至少 2 次合併，全場敵人受 1 傷害。','同一次滑動至少 2 次合併，全場敵人受 2 傷害。','同一次滑動至少 2 次合併，全場敵人受 3 傷害。','同一次滑動至少 2 次合併，傷害等於本次合併次數，並讓全體友方獲得守護。'],'幸運':['每 10 次有效移動，下一個普通英雄有 25% 機率提升一階。','每 10 次有效移動，下一個普通英雄有 50% 機率提升一階。','每 10 次有效移動，下一個普通英雄有 75% 機率提升一階。','每 10 次有效移動，下一個普通英雄必定提升一階。'],'遺爆':['我方單位確實死亡時，死亡位置周圍 8 格隨機 1 名敵人受 1 傷害。','我方單位確實死亡時，死亡位置周圍 8 格隨機 2 名敵人各受 1 傷害。','我方單位確實死亡時，死亡位置周圍 8 格隨機 3 名敵人各受 1 傷害。','我方單位確實死亡時，死亡位置周圍 8 格全部敵人各受 1 傷害。'],'遺志':['我方單位確實死亡後，下一次合併隨機攻擊 1 名敵人。','我方單位確實死亡後，下一次合併隨機攻擊 2 名敵人。','我方單位確實死亡後，下一次合併隨機攻擊 3 名敵人。','我方單位確實死亡後，下一次合併攻擊全場敵人。'],'血祭':['每 3 名我方單位確實死亡，下一個生成英雄提升 1 階。','每 3 名我方單位確實死亡，下一個生成英雄提升 2 階。','每 3 名我方單位確實死亡，下一個生成英雄提升 3 階。','每 3 名我方單位確實死亡，下一個生成英雄提升 3 階並直接成為特殊單位。'],'先制':['Boss 進場時立即受到 2 傷害。','Boss 進場時立即受到 3 傷害。','Boss 進場時立即受到 4 傷害。','Boss 進場時立即受到 5 傷害，並跳過本次 Boss 行動。'],'優質增援':['每第 10 名生成英雄直接生成數字 2。','每第 10 名生成英雄直接生成數字 4。','每第 10 名生成英雄直接生成數字 8。','每第 10 名生成英雄直接生成數字 8 的特殊單位。'],'突變':['新英雄生成時有 10% 機率成為特殊單位。','新英雄生成時有 20% 機率成為特殊單位。','新英雄生成時有 30% 機率成為特殊單位。','新英雄生成時有 40% 機率成為特殊單位。'],'高風險投資':['擊殺敵人得分 ×2；我方死亡扣分 ×4。','擊殺敵人得分 ×2；我方死亡扣分 ×3.5。','擊殺敵人得分 ×2；我方死亡扣分 ×3。','擊殺敵人得分 ×2；我方死亡扣分 ×2.5。'],'強襲':['對 Boss 造成傷害時額外 +1。','對 Boss 造成傷害時額外 +2。','對 Boss 造成傷害時額外 +3。','對 Boss 造成傷害時額外 +4。'],'援軍':['英雄生成時有 5% 機率額外生成 1 名相同英雄。','英雄生成時有 10% 機率額外生成 1 名相同英雄。','英雄生成時有 15% 機率額外生成 1 名相同英雄。','英雄生成時有 20% 機率額外生成 1 名相同英雄。']};
const groups=[['base','特殊職業 · 基礎能力',[['⚔️ 戰士 · 迎戰','特殊戰士接觸敵人時，對接觸的敵人造成 1 點傷害。'],['⚔️ 戰士 · 突進','特殊戰士實際移動後接觸敵人時發動近戰攻擊。'],['🏹 遊俠 · 遠射','遊俠實際移動後，有 50% 機率對周圍 8 格以外最遠的敵人造成 1 點傷害。'],['🏹 遊俠 · 回身射擊','遊俠移動後，向本次移動的反方向射擊；該方向有敵人時攻擊第一個敵人。'],['✨ 祭司 · 治癒波','特殊祭司進場時，治療周圍 8 格內的我方單位 1 HP。'],['✨ 祭司 · 守護','祭司實際移動後，自己與周圍 8 格內友方獲得守護；下一次受到傷害時傷害 -1，之後消耗。']]],['warrior','戰士 · 熟練度技能',['橫掃','衝擊','重擊']],['ranger','遊俠 · 熟練度技能',['狙擊','迅捷射擊','箭雨']],['priest','祭司 · 熟練度技能',['聖療','復甦','懲戒']],['common','特殊共用技能',[['🌟 躍升','兩個特殊單位彼此合併時，合併結果一次提升 2 個數字階級。'],['🔁 連奏','特殊單位的進場基礎能力自動額外施放 1 次。'],['🔗 連攜','新的特殊單位進場時，場上其他特殊單位各觸發 1 次自己的進場基礎能力；不遞迴觸發連攜。'],['👑 覺醒','當場上所有我方單位都只剩特殊單位時，本局之後生成的英雄全部直接成為特殊單位。'],['♻️ 轉生','特殊單位第一次死亡時，下一個普通英雄改為特殊單位；由轉生產生的特殊單位不再具有轉生資格。']]],['general','一般技能',['疾行','風壓','餘勢','波動共鳴','超載','幸運','遺爆','遺志','血祭','先制','優質增援','突變','高風險投資','強襲','援軍']]];
const c=document.getElementById('content');for(const [id,title,items] of groups){let sec=document.createElement('section');sec.className='group';sec.id=id;sec.innerHTML='<h2>'+title+'</h2>';for(const item of items){if(Array.isArray(item)){sec.innerHTML+='<article class="skill"><span class="tag">固定能力</span><h3>'+item[0]+'</h3><div class="fixed">'+item[1]+'</div></article>'}else{let r=mastery[item];sec.innerHTML+='<article class="skill"><h3>'+item+'</h3><div class="levels">'+r.map((x,i)=>'<div class="lv"><b>'+['LV1','LV2','LV3','MAX'][i]+'</b>'+x+'</div>').join('')+'</div></article>'}}c.appendChild(sec)}
</script></body></html>
