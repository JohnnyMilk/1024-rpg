<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101817"><title>1024 CITY · Type 02 v0.3</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#0d1414;color:#eef3ef}body{padding-bottom:env(safe-area-inset-bottom);background:radial-gradient(circle at 75% 0,#24423855,transparent 32%),#0d1414}button{font:inherit}.app{width:min(100%,560px);margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 10px 35px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand small{display:block;color:#83b69d;font:800 9px/1 ui-monospace,monospace;letter-spacing:.12em}.brand b{font-size:20px}.btn{border:1px solid #344842;background:#17211f;color:#dce6e1;border-radius:10px;padding:8px 10px;font-size:11px;font-weight:800}.card{background:#121b19;border:1px solid #293a35;border-radius:17px;padding:11px;margin-top:9px}.title{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}.title b{font-size:13px}.title span{font:800 9px/1 ui-monospace,monospace;color:#738981}.cityMap{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.districtMini{aspect-ratio:1;border:1px solid #30413c;border-radius:9px;background:#18231f;padding:3px;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;position:relative}.districtMini.locked{background:#0e1514;opacity:.35}.districtMini.available{border-color:#d6b76c;box-shadow:inset 0 0 0 1px #d6b76c55}.districtMini.active{border-color:#7db598;box-shadow:inset 0 0 0 2px #7db59866}.miniCell{border-radius:2px;background:#22302c;font-size:8px;display:flex;align-items:center;justify-content:center}.miniTag{position:absolute;right:3px;bottom:2px;font:800 7px/1 ui-monospace;color:#9bada6;background:#0b1210bb;padding:2px 3px;border-radius:3px}.hud{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-top:8px}.stat{background:#17211f;border-radius:9px;padding:7px;text-align:center}.stat small{display:block;color:#81958e;font-size:8px}.stat b{font-size:13px}.play{display:grid;grid-template-columns:1fr 104px;gap:9px}.board{aspect-ratio:1;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:#0b1110;border:1px solid #30423c;border-radius:14px;padding:6px}.cell{border:0;border-radius:10px;background:#1a2723;color:#eef4f0;min-width:0;position:relative;padding:0}.cell:active{transform:scale(.96)}.tile{position:absolute;inset:3px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#38564a}.tile.ind{background:#5a5143}.tile.ene{background:#405664}.tile.pub{background:#3f654c}.tile b{font-size:22px;line-height:1}.tile small{font-size:8px;font-weight:900;margin-top:2px}.side{display:flex;flex-direction:column;gap:6px}.next{background:#17231f;border:1px solid #31443d;border-radius:12px;padding:9px;text-align:center}.next small{font-size:8px;color:#82968e}.next .emoji{font-size:35px;line-height:1.2}.next b{display:block;font-size:10px}.plans{font-size:11px;color:#9badA6;line-height:1.45}.reroll{width:100%;border:1px solid #4c5f57;background:#1d2b27;color:#e4ece8;border-radius:10px;padding:9px 4px;font-size:10px;font-weight:800}.reroll:disabled{opacity:.35}.tip{font-size:10px;line-height:1.5;color:#81958e;margin-top:7px}.feedback{min-height:38px;border-radius:11px;background:#101715;padding:8px 10px;font-size:10px;line-height:1.45;color:#9fb0aa;margin-top:8px}.feedback strong{color:#e5c678}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px}.sum{padding:7px 3px;text-align:center;border-radius:8px;background:#17211f;font-size:9px;color:#8fa199}.sum b{display:block;color:#e5ece8;font-size:13px}.overlay{position:fixed;inset:0;background:#07100eea;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.overlay.show{display:flex}.modal{width:min(94vw,420px);background:#17221f;border:1px solid #466158;border-radius:19px;padding:18px}.modal small{color:#80b89c;font-weight:900}.modal h2{margin:7px 0}.modal p{color:#a7b5b0;font-size:12px;line-height:1.55}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.choices button{border:1px solid #40544d;background:#101916;color:#e7eeea;border-radius:11px;padding:12px 4px;font-weight:900}.score{font-size:34px;font-weight:900;color:#e4c779}@media(max-width:390px){.play{grid-template-columns:1fr 90px}.tile b{font-size:19px}.app{padding-left:7px;padding-right:7px}}@media(min-width:700px){.app{width:min(94vw,900px)}.play{grid-template-columns:minmax(300px,420px) 1fr}.side{justify-content:flex-start}.cityMap{max-width:520px;margin:auto}}</style></head><body><main class="app"><header class="top"><div class="brand"><small>TYPE 02 · VERSION 1 · v0.3 POC</small><b>DISTRICT CITY</b></div><div><button class="btn" onclick="location.href='../type-02/'">企劃</button> <button class="btn" id="reset">重來</button></div></header><section class="card"><div class="title"><b>完整城市</b><span>3 × 3 DISTRICTS</span></div><div class="cityMap" id="cityMap"></div><div class="hud"><div class="stat"><small>人口</small><b id="pop">0</b></div><div class="stat"><small>財政</small><b id="cash">0</b></div><div class="stat"><small>能源</small><b id="energy">0</b></div><div class="stat"><small>幸福</small><b id="happy">0</b></div></div></section><section class="card"><div class="title"><b id="districtTitle">中央區</b><span id="turnLabel">0 / 16</span></div><div class="play"><div><div class="board" id="board"></div><div class="tip">點空格放置建物。與上下左右同類同級建物相鄰時會自動合併；連續符合可連鎖升級。</div></div><aside class="side"><div class="next"><small>NEXT PLAN</small><div class="emoji" id="nextEmoji">🏠</div><b id="nextName">住宅 LV.1</b></div><div class="plans" id="plansText">每區 16 次都市規劃。</div><button class="reroll" id="reroll">↻ 更換規劃<br>每區 1 次</button><div class="summary"><div class="sum">🏠<b id="res">0</b></div><div class="sum">🏭<b id="ind">0</b></div><div class="sum">⚡<b id="ene">0</b></div><div class="sum">🌳<b id="pub">0</b></div></div></aside></div><div class="feedback" id="feedback">中央區開始開發。第一個物件放在哪裡，由你決定。</div></section></main><div class="overlay" id="expand"><div class="modal"><small>DISTRICT COMPLETE</small><h2>這一區完成了</h2><p id="expandText"></p><p>在上方城市縮圖中，選擇一個發亮的相鄰區域作為下一個開發區。</p></div></div><div class="overlay" id="final"><div class="modal"><small>CITY COMPLETE</small><h2>城市總結</h2><div class="score" id="finalScore">0</div><p id="finalText"></p><button class="reroll" id="again">重新建立城市</button></div></div><script>(()=>{'use strict';const SIZE=4,MAX_TURNS=16,TYPES={res:{e:'🏠',n:'住宅'},ind:{e:'🏭',n:'工商'},ene:{e:'⚡',n:'能源'},pub:{e:'🌳',n:'公共'}},names=['西北區','北區','東北區','西區','中央區','東區','西南區','南區','東南區'];let districts,current,turn,nextType,rerollUsed,cash,feedback;const $=id=>document.getElementById(id);const empty=()=>Array.from({length:SIZE},()=>Array(SIZE).fill(null));function newDistrict(){return{grid:empty(),done:false}}function randomType(){let a=Object.keys(TYPES);return a[Math.floor(Math.random()*a.length)]}function init(){districts=Array.from({length:9},newDistrict);current=4;turn=0;nextType=randomType();rerollUsed=false;cash=500;feedback='中央區開始開發。第一個物件放在哪裡，由你決定。';$('expand').classList.remove('show');$('final').classList.remove('show');render()}function neighbors(r,c){return[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([a,b])=>a>=0&&a<SIZE&&b>=0&&b<SIZE)}function place(r,c){let g=districts[current].grid;if(g[r][c]||turn>=MAX_TURNS)return;g[r][c]={type:nextType,lv:1};let merges=resolve(g,r,c);turn++;cash+=merges*15;feedback=merges?`✨ ${TYPES[g[r][c].type].n}完成 ${merges} 次合併，升到 LV.${g[r][c].lv}！`:`${TYPES[nextType].e} ${TYPES[nextType].n}已配置到第 ${turn} 個規劃位置。`;nextType=randomType();render();if(turn>=MAX_TURNS)setTimeout(completeDistrict,220)}function resolve(g,r,c){let count=0;while(true){let t=g[r][c],match=neighbors(r,c).find(([a,b])=>g[a][b]&&g[a][b].type===t.type&&g[a][b].lv===t.lv);if(!match)break;g[match[0]][match[1]]=null;t.lv++;count++}return count}function totals(){let out={res:0,ind:0,ene:0,pub:0};districts.forEach(d=>d.grid.flat().forEach(t=>{if(t)out[t.type]+=2**(t.lv-1)}));return out}function stats(){let t=totals(),pop=t.res*18,jobs=t.ind*20,supply=t.ene*24,demand=t.res*7+t.ind*8+t.pub*2,energy=Math.min(100,Math.round(supply/Math.max(1,demand)*100)),happy=Math.max(10,Math.min(100,55+t.pub*4-Math.max(0,t.ind-t.pub)*2+(energy>85?8:-8)));return{...t,pop,jobs,energy,happy}}function render(){let g=districts[current].grid,b=$('board');b.innerHTML='';for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){let bt=document.createElement('button');bt.className='cell';bt.type='button';let t=g[r][c];if(t){let d=document.createElement('div');d.className='tile '+t.type;d.innerHTML=`<b>${TYPES[t.type].e}</b><small>LV.${t.lv}</small>`;bt.appendChild(d)}else bt.onclick=()=>place(r,c);b.appendChild(bt)}$('districtTitle').textContent=names[current];$('turnLabel').textContent=`${turn} / ${MAX_TURNS}`;$('nextEmoji').textContent=TYPES[nextType].e;$('nextName').textContent=TYPES[nextType].n+' LV.1';$('reroll').disabled=rerollUsed||turn>=MAX_TURNS;$('feedback').innerHTML=feedback.replace('✨','<strong>✨</strong>');let s=stats();$('pop').textContent=s.pop;$('cash').textContent='$'+cash;$('energy').textContent=s.energy+'%';$('happy').textContent=s.happy;['res','ind','ene','pub'].forEach(k=>$(k).textContent=s[k]);renderMap()}function renderMap(){let map=$('cityMap');map.innerHTML='';let doneCount=districts.filter(d=>d.done).length;let avail=available();districts.forEach((d,i)=>{let box=document.createElement('button');box.type='button';box.className='districtMini '+(i===current&&!d.done?'active':d.done?'':'locked');if(avail.includes(i)&&$('expand').classList.contains('show'))box.className='districtMini available';d.grid.flat().forEach(t=>{let c=document.createElement('span');c.className='miniCell';c.textContent=t?TYPES[t.type].e:'';box.appendChild(c)});let tag=document.createElement('span');tag.className='miniTag';tag.textContent=i===current&&!d.done?'NOW':d.done?'DONE':names[i];box.appendChild(tag);if(avail.includes(i)&&$('expand').classList.contains('show'))box.onclick=()=>startDistrict(i);map.appendChild(box)})}function available(){let r=Math.floor(current/3),c=current%3;return[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([a,b])=>a>=0&&a<3&&b>=0&&b<3).map(([a,b])=>a*3+b).filter(i=>!districts[i].done&&i!==current)}function completeDistrict(){districts[current].done=true;cash+=120;let count=districts.filter(d=>d.done).length;if(count===9){showFinal();return}let a=available();if(!a.length){let remaining=districts.map((d,i)=>!d.done?i:-1).filter(i=>i>=0);a=remaining}feedback=`${names[current]}完成。城市現在有 ${count}/9 個完成區域。`;$('expandText').textContent=`${names[current]}完成 16 次規劃。城市獎勵 $120。`;$('expand').classList.add('show');renderMap();if(!available().length){let first=districts.findIndex(d=>!d.done);setTimeout(()=>startDistrict(first),700)}}function startDistrict(i){current=i;turn=0;nextType=randomType();rerollUsed=false;feedback=`開始開發${names[i]}。新的 16 次規劃開始。`;$('expand').classList.remove('show');render()}function showFinal(){let s=stats(),score=Math.round(s.pop+cash+s.energy*8+s.happy*8+(s.res+s.ind+s.ene+s.pub)*25);$('finalScore').textContent=score.toLocaleString();$('finalText').textContent=`人口 ${s.pop} · 財政 $${cash} · 能源 ${s.energy}% · 幸福 ${s.happy}。九個 4×4 區域共同構成這一局的完整城市。`;$('final').classList.add('show')}$('reroll').onclick=()=>{if(rerollUsed)return;let old=nextType;do nextType=randomType();while(nextType===old);rerollUsed=true;feedback=`更換規劃：${TYPES[old].e} → ${TYPES[nextType].e}`;render()};$('reset').onclick=()=>{if(confirm('重新開始 v0.3 POC？'))init()};$('again').onclick=init;init()})();</script></body></html>
