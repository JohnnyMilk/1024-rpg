<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101817"><title>1024 CITY · Type 02 v0.3</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#0d1414;color:#eef3ef}body{padding-bottom:env(safe-area-inset-bottom);background:radial-gradient(circle at 75% 0,#24423855,transparent 32%),#0d1414}button{font:inherit}.app{width:min(100%,560px);margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 9px 35px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand small{display:block;color:#83b69d;font:800 9px/1 ui-monospace,monospace;letter-spacing:.12em}.brand b{font-size:20px}.btn{border:1px solid #344842;background:#17211f;color:#dce6e1;border-radius:10px;padding:8px 10px;font-size:11px;font-weight:800}.card{background:#121b19;border:1px solid #293a35;border-radius:17px;padding:11px;margin-top:9px}.title{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}.title b{font-size:13px}.title span{font:800 9px/1 ui-monospace,monospace;color:#738981}.cityMap{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.districtMini{aspect-ratio:1;border:1px solid #30413c;border-radius:9px;background:#0e1514;padding:3px;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;position:relative;opacity:.38}.districtMini.done{opacity:1;background:#18231f}.districtMini.active{opacity:1;border-color:#7db598;box-shadow:inset 0 0 0 2px #7db59866}.miniCell{border-radius:2px;background:#22302c;font-size:7px;display:flex;align-items:center;justify-content:center}.miniTag{position:absolute;right:3px;bottom:2px;font:800 7px/1 ui-monospace;color:#d6e1dc;background:#0b1210cc;padding:2px 3px;border-radius:3px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.stat{background:#17211f;border-radius:9px;padding:7px;text-align:center}.stat small{display:block;color:#81958e;font-size:8px}.stat b{font-size:13px}.gameRow{display:grid;grid-template-columns:112px 1fr;gap:9px;align-items:start}.info{display:flex;flex-direction:column;gap:6px}.ibox{background:#17231f;border:1px solid #31443d;border-radius:11px;padding:8px}.ibox small{display:block;font-size:8px;color:#82968e}.ibox b{font-size:12px}.theme{font-size:27px;line-height:1.2}.board{aspect-ratio:1;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:#0b1110;border:1px solid #30423c;border-radius:14px;padding:6px;touch-action:none;user-select:none}.cell{border-radius:10px;background:#1a2723;position:relative}.tile{position:absolute;inset:3px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#38564a;box-shadow:0 3px 8px #0004}.tile.l2{background:#416357}.tile.l3{background:#526f61}.tile.l4{background:#6a806e}.tile.l5{background:#8a8d70}.tile b{font-size:clamp(18px,6vw,28px);line-height:1}.tile small{font-size:7px;font-weight:900;margin-top:3px;color:#e9eee9}.tip{font-size:10px;line-height:1.5;color:#81958e;margin-top:7px}.feedback{min-height:40px;border-radius:11px;background:#101715;padding:8px 10px;font-size:10px;line-height:1.45;color:#9fb0aa;margin-top:8px}.feedback strong{color:#e5c678}.overlay{position:fixed;inset:0;background:#07100ef2;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.overlay.show{display:flex}.modal{width:min(94vw,420px);max-height:88vh;overflow:auto;background:#17221f;border:1px solid #466158;border-radius:19px;padding:18px}.modal small{color:#80b89c;font-weight:900}.modal h2{margin:7px 0}.modal p{color:#a7b5b0;font-size:12px;line-height:1.55}.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px}.choices button{border:1px solid #40544d;background:#101916;color:#e7eeea;border-radius:11px;padding:12px 6px;font-weight:900;min-height:48px}.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.themes button{border:1px solid #40544d;background:#101916;color:#e7eeea;border-radius:11px;padding:10px 3px;font-size:20px}.themes button.sel{border-color:#d6b76c;background:#302a1d}.score{font-size:34px;font-weight:900;color:#e4c779}.again{width:100%;border:1px solid #4c5f57;background:#1d2b27;color:#e4ece8;border-radius:10px;padding:11px;font-weight:800}@media(max-width:380px){.gameRow{grid-template-columns:96px 1fr}.app{padding-left:6px;padding-right:6px}}@media(min-width:700px){.app{width:min(94vw,850px)}.gameRow{grid-template-columns:180px minmax(320px,430px);justify-content:center}}</style></head><body><main class="app"><header class="top"><div class="brand"><small>TYPE 02 · VERSION 1 · v0.3 POC</small><b>SWIPE DISTRICT CITY</b></div><div><button class="btn" onclick="location.href='../type-02/'">企劃</button> <button class="btn" id="reset">重來</button></div></header><section class="card"><div class="title"><b>完整城市</b><span>3 × 3 DISTRICTS</span></div><div class="cityMap" id="cityMap"></div><div class="hud"><div class="stat"><small>人口</small><b id="pop">0</b></div><div class="stat"><small>財政</small><b id="cash">$500</b></div><div class="stat"><small>能源</small><b id="energy">100%</b></div><div class="stat"><small>幸福</small><b id="happy">60</b></div></div></section><section class="card"><div class="title"><b id="districtTitle">中央區</b><span id="moveLabel">12 MOVES</span></div><div class="gameRow"><aside class="info"><div class="ibox"><small>DISTRICT TYPE</small><div class="theme" id="themeEmoji">🏠</div><b id="themeName">住宅區</b></div><div class="ibox"><small>本區最高發展</small><b id="best">2</b></div><div class="ibox"><small>有效滑動</small><b id="moves">0 / 12</b></div></aside><div><div class="board" id="board"></div><div class="tip">維持標準 1024 操作：上下左右滑動，相同數字合併。每個 4×4 棋盤就是城市的一個區域。</div></div></div><div class="feedback" id="feedback">中央住宅區開始。用 12 次有效滑動發展這個區域。</div></section></main><div class="overlay" id="expand"><div class="modal"><small>DISTRICT COMPLETE</small><h2 id="completeTitle">區域完成</h2><p id="completeText"></p><p><b>① 選下一區用途</b></p><div class="themes" id="themeChoices"></div><p><b>② 選擇相鄰區域</b></p><div class="choices" id="locationChoices"></div></div></div><div class="overlay" id="final"><div class="modal"><small>CITY COMPLETE</small><h2>城市總結</h2><div class="score" id="finalScore">0</div><p id="finalText"></p><button class="again" id="again">重新建立城市</button></div></div><script>(()=>{'use strict';const N=4,MAX=12,T={res:{e:'🏠',n:'住宅區'},ind:{e:'🏭',n:'工商區'},ene:{e:'⚡',n:'能源區'},pub:{e:'🌳',n:'公共區'}},names=['西北區','北區','東北區','西區','中央區','東區','西南區','南區','東南區'];let ds,current,moves,cash,pendingTheme='res',feedback='';const $=id=>document.getElementById(id),blank=()=>Array.from({length:N},()=>Array(N).fill(0));function district(theme='res'){return{grid:blank(),theme,done:false,best:1}}function spawn(g,n=1){for(let k=0;k<n;k++){let e=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!g[r][c])e.push([r,c]);if(!e.length)return;let [r,c]=e[Math.floor(Math.random()*e.length)];g[r][c]=Math.random()<.9?1:2}}function init(){ds=Array.from({length:9},()=>district());current=4;ds[4].theme='res';moves=0;cash=500;pendingTheme='res';feedback='中央住宅區開始。用 12 次有效滑動發展這個區域。';spawn(ds[4].grid,2);$('expand').classList.remove('show');$('final').classList.remove('show');render()}function snap(g){return JSON.stringify(g)}function compress(line){let a=line.filter(Boolean),o=[],merges=0;for(let i=0;i<a.length;i++){if(i<a.length-1&&a[i]===a[i+1]){o.push(a[i]+1);merges++;i++}else o.push(a[i])}while(o.length<N)o.push(0);return{line:o,merges}}function move(dir){if(moves>=MAX)return;let g=ds[current].grid,before=snap(g),merged=0;if(dir==='left'||dir==='right'){for(let r=0;r<N;r++){let a=g[r].slice();if(dir==='right')a.reverse();let x=compress(a);if(dir==='right')x.line.reverse();g[r]=x.line;merged+=x.merges}}else{for(let c=0;c<N;c++){let a=[];for(let r=0;r<N;r++)a.push(g[r][c]);if(dir==='down')a.reverse();let x=compress(a);if(dir==='down')x.line.reverse();for(let r=0;r<N;r++)g[r][c]=x.line[r];merged+=x.merges}}if(snap(g)===before)return;moves++;cash+=merged*12;spawn(g);ds[current].best=Math.max(ds[current].best,...g.flat());feedback=merged?`✨ 本次完成 ${merged} 次合併；${names[current]}持續升級。`:`第 ${moves} 次有效規劃完成。`;render();if(moves>=MAX)setTimeout(complete,180)}function districtPower(d){return d.grid.flat().reduce((s,v)=>s+(v?2**(v-1):0),0)}function totals(){let o={res:0,ind:0,ene:0,pub:0};ds.filter(d=>d.done||d===ds[current]).forEach(d=>o[d.theme]+=districtPower(d));return o}function stats(){let x=totals(),pop=x.res*7,supply=30+x.ene*11,demand=x.res*3+x.ind*4+x.pub,energy=Math.min(100,Math.round(supply/Math.max(1,demand)*100)),happy=Math.max(10,Math.min(100,58+Math.round(x.pub*1.3)-Math.max(0,x.ind-x.pub)-Math.max(0,80-energy)/2));return{...x,pop,energy,happy}}function render(){let d=ds[current],g=d.grid,b=$('board');b.innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){let cell=document.createElement('div');cell.className='cell';let lv=g[r][c];if(lv){let t=document.createElement('div');t.className='tile l'+Math.min(5,lv);t.innerHTML=`<b>${2**lv}</b><small>${T[d.theme].e} LV.${lv}</small>`;cell.appendChild(t)}b.appendChild(cell)}$('districtTitle').textContent=names[current]+' · '+T[d.theme].n;$('themeEmoji').textContent=T[d.theme].e;$('themeName').textContent=T[d.theme].n;$('moves').textContent=`${moves} / ${MAX}`;$('moveLabel').textContent=`${MAX-moves} MOVES LEFT`;$('best').textContent=2**d.best;$('feedback').innerHTML=feedback.replace('✨','<strong>✨</strong>');let s=stats();$('pop').textContent=s.pop;$('cash').textContent='$'+cash;$('energy').textContent=s.energy+'%';$('happy').textContent=Math.round(s.happy);renderMap()}function renderMap(){let m=$('cityMap');m.innerHTML='';ds.forEach((d,i)=>{let box=document.createElement('div');box.className='districtMini '+(d.done?'done ':'')+(i===current&&!d.done?'active':'');d.grid.flat().forEach(v=>{let c=document.createElement('span');c.className='miniCell';c.textContent=v?T[d.theme].e:'';box.appendChild(c)});let tag=document.createElement('span');tag.className='miniTag';tag.textContent=d.done?T[d.theme].e:(i===current?'NOW':names[i]);box.appendChild(tag);m.appendChild(box)})}function adjacent(){let r=Math.floor(current/3),c=current%3;return[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([a,b])=>a>=0&&a<3&&b>=0&&b<3).map(([a,b])=>a*3+b).filter(i=>!ds[i].done&&i!==current)}function complete(){let d=ds[current];d.done=true;let reward=80+d.best*30;cash+=reward;let count=ds.filter(x=>x.done).length;if(count===9){showFinal();return}feedback=`${names[current]}完成，城市已有 ${count}/9 個區域。`;$('completeTitle').textContent=`${names[current]}完成`;$('completeText').textContent=`最高發展 ${2**d.best}，區域獎勵 $${reward}。接著決定城市往哪裡發展。`;pendingTheme='res';drawExpand();$('expand').classList.add('show')}function drawExpand(){$('themeChoices').innerHTML='';Object.entries(T).forEach(([k,v])=>{let b=document.createElement('button');b.type='button';b.textContent=v.e;b.title=v.n;b.classList.toggle('sel',k===pendingTheme);b.onclick=()=>{pendingTheme=k;drawExpand()};$('themeChoices').appendChild(b)});let a=adjacent();if(!a.length)a=ds.map((d,i)=>!d.done?i:-1).filter(i=>i>=0);let loc=$('locationChoices');loc.innerHTML='';a.forEach(i=>{let b=document.createElement('button');b.type='button';b.textContent=names[i];b.onclick=()=>start(i,pendingTheme);loc.appendChild(b)})}function start(i,theme){current=i;ds[i]=district(theme);moves=0;spawn(ds[i].grid,2);feedback=`開始開發${names[i]} · ${T[theme].n}。`; $('expand').classList.remove('show');render()}function showFinal(){let s=stats(),score=Math.round(s.pop+cash+s.energy*8+s.happy*8+(s.res+s.ind+s.ene+s.pub)*12);$('finalScore').textContent=score.toLocaleString();$('finalText').textContent=`人口 ${s.pop} · 財政 $${cash} · 能源 ${s.energy}% · 幸福 ${Math.round(s.happy)}。九個 4×4 的 1024 區域共同構成完整城市。`;$('final').classList.add('show')}let sx=0,sy=0;$('board').addEventListener('touchstart',e=>{let t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});$('board').addEventListener('touchend',e=>{let t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});document.addEventListener('keydown',e=>{let d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d){e.preventDefault();move(d)}});$('reset').onclick=()=>{if(confirm('重新開始 v0.3 POC？'))init()};$('again').onclick=init;init()})();</script></body></html>
