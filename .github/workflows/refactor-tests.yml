name: Refactor regression tests
on:
  push:
    branches: [ main, v0-3-playable, v0-4-special-classes, v0-4-visual-pass-final ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run regression assertions
        run: node tests/refactor.test.js
      - name: Run v0.4 visual assertions
        run: node tests/v04-visual.test.js
      - name: Syntax check shared core
        run: node --check shared/core.js
      - name: Syntax check shared animations
        run: node --check shared/animations.js
      - name: Syntax check shared help
        run: node --check shared/game-help.js
      - name: Syntax check standard 1024
        run: node --check classic/game.js
      - name: Syntax check Version 1
        run: node --check rpg-v1-0/game.js
      - name: Syntax check Version 1 help data
        run: node --check rpg-v1-0/help-data.js
      - name: Syntax check Version 2 v0.2
        run: node --check rpg-v2-v0-2/game.js
      - name: Syntax check Version 2 v0.2 help data
        run: node --check rpg-v2-v0-2/help-data.js
      - name: Syntax check Version 2 v0.3
        run: node --check rpg-v2-v0-3/game.js
      - name: Syntax check Version 2 v0.3 help data
        run: node --check rpg-v2-v0-3/help-data.js
      - name: Syntax check Version 2 v0.4
        run: node --check rpg-v2-v0-4/game.js
      - name: Syntax check Version 2 v0.4 visual animations
        run: node --check rpg-v2-v0-4/visual-animations.js
      - name: Syntax check Version 2 v0.4 visual polish
        run: node --check rpg-v2-v0-4/visual-polish.js
      - name: Syntax check Version 2 v0.4 help data
        run: node --check rpg-v2-v0-4/help-data.js
