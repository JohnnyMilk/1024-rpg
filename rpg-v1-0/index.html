<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>1024 RPG Type 01 v1.0</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#101419;color:#eef3f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}body{display:flex;justify-content:center}.app{width:min(96vw,600px);padding:20px 14px 30px}.top{display:flex;justify-content:space-between;gap:10px}.top h1{margin:0}.sub,.log{color:#9ba7b2;font-size:12px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:12px 0}.stat{background:#1a2027;border:1px solid #2a323b;border-radius:9px;padding:6px;text-align:center}.stat span{display:block;font-size:8px;color:#7f8b96}.board{position:relative;width:min(91vw,520px);aspect-ratio:1;margin:auto;background:#252d35;border-radius:18px;padding:10px;touch-action:none;overflow:hidden}.grid{position:absolute;inset:10px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px}.cell{background:#151a20;border-radius:12px}.pieces,.effects{position:absolute;inset:10px}.effects{pointer-events:none;z-index:5}.piece,.moveghost,.deathfx,.mergefx{position:absolute;width:calc((100% - 24px)/4);height:calc((100% - 24px)/4);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.piece.hideForMove{opacity:0}.moveghost{z-index:15;transition:transform .25s cubic-bezier(.22,.8,.24,1)}.deathfx{animation:fade .25s forwards}.mergefx{animation:pulse .25s forwards;background:#68717f}.heroUnit{background:#4a4f5a}.enemy{background:#5c3138}.boss{background:#7a3030}.heroNum{font-size:42px;font-weight:950}.icon{font-size:24px}.name,.tier{font-size:10px}.damagefx{position:absolute;width:calc((100% - 24px)/4);height:calc((100% - 24px)/4);display:flex;justify-content:center;padding-top:12px;z-index:18;font-weight:900;color:#ffdddd;animation:dmg 1s forwards}.overlay{position:absolute;inset:0;z-index:30;background:#0f1318f2;display:none;align-items:center;justify-content:center;text-align:center;padding:20px}.overlay.show{display:flex}.overlay p{line-height:1.55;font-size:13px}.score{display:block;font-size:28px;font-weight:950;margin:6px}.log,.rules{background:#171c22;border:1px solid #272f37;border-radius:12px;padding:10px;margin:10px 0}.rules{font-size:11px;line-height:1.6}.bar{display:flex;justify-content:space-between;align-items:center}button{border:0;border-radius:9px;background:#2c3743;color:#fff;padding:9px 12px;font-weight:900}a{color:#9da9b5;text-decoration:none;font-weight:800}@keyframes fade{to{opacity:0;scale:.2}}@keyframes pulse{50%{scale:1.16}to{opacity:0}}@keyframes dmg{0%{opacity:0;translate:0 10px}20%{opacity:1}to{opacity:0;translate:0 -12px}}@media(max-width:480px){.top{display:block}.stats{grid-template-columns:repeat(5,1fr)}}</style></head><body><div class="app"><a href="../type-01/">← Type 01</a><div class="top"><div><h1>1024 RPG</h1><div class="sub">Type 01 · v1.0 · 正式版</div></div></div><div class="stats"><div class="stat"><span>SCORE</span><b id="score">0</b></div><div class="stat"><span>TURN</span><b id="turn">0</b></div><div class="stat"><span>MERGES</span><b id="merges">0</b></div><div class="stat"><span>BOSS</span><b id="boss">20</b></div><div class="stat"><span>WAVE</span><b id="wave">1</b></div></div><div class="bar"><button id="restart">重新開始</button><small>每回合 +1 英雄 · 每 2 回合 +1 敵人</small></div><div class="log" id="log">v1.0 正式版：暗影組織無盡挑戰。</div><div class="board" id="board"><div class="grid" id="grid"></div><div class="pieces" id="pieces"></div><div class="effects" id="effects"></div><div class="overlay" id="overlay"><div><h2 id="ot"></h2><p id="op"></p><button id="again">再玩一次</button></div></div></div><div class="rules"><b>計分規則</b>：有效移動 +1；合併加上合併後數字；擊敗暗影刺客 +20；擊敗 Boss +100；英雄死亡扣除該英雄數字，SCORE 最低為 0。<br>Boss 每 20 回合登場：⚔️ 暗影劍士 → 🌑 暗夜領主 → 👁️ 深淵之眼 → ☠️ 死亡之影 → 👑 暗影之王。Boss HP 10 起，每波 +5；ATK 以 1、1、2、2、3、3…成長。</div></div><script>(()=>{const N=4,BOSS_INTERVAL=20,MOVE_MS=250,MERGE_MS=250,DAMAGE_MS=1000,DEATH_MS=250,$=id=>document.getElementById(id),grid=$('grid'),pieces=$('pieces'),effects=$('effects'),board=$('board'),logEl=$('log'),overlay=$('overlay'),wait=ms=>new Promise(r=>setTimeout(r,ms)),rand=a=>a[Math.floor(Math.random()*a.length)];for(let i=0;i<16;i++)grid.appendChild(document.createElement('div')).className='cell';let E=[],turn=0,mergeCount=0,id=1,touch=null,ended=false,bossLevel=1,bossDefeated=0,nextBossTurn=20,bossActive=false,busy=false,score=0,moveCount=0,enemyDefeated=0,heroesLost=0,highestTile=1,moveScore=0,mergeScore=0,enemyScore=0,bossScore=0,deathPenalty=0;const bossMax=()=>10+(bossLevel-1)*5,enemyDamage=()=>Math.ceil((bossDefeated+1)/2),bossDamage=()=>Math.ceil(bossLevel/2),BOSS=[['⚔️','暗影劍士'],['🌑','暗夜領主'],['👁️','深淵之眼'],['☠️','死亡之影'],['👑','暗影之王']];function roman(n){let m=[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']],s='';for(let[v,c]of m)while(n>=v){s+=c;n-=v}return s}function bossInfo(l=bossLevel){let i=(l-1)%5,c=Math.floor((l-1)/5)+1,[icon,name]=BOSS[i];return{icon,name:name+(c>1?' '+roman(c):'')}}function empty(list=E){let u=new Set(list.map(x=>x.r+','+x.c)),a=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!u.has(r+','+c))a.push([r,c]);return a}function heroValue(e){return Math.max(1,(e.tier||2)/2)}function limit(e){return e.type==='hero'?e.tier:e.maxHits}function remain(e){return Math.max(0,limit(e)-(e.hits||0))}function addHero(){let a=empty();if(!a.length)return;let[r,c]=rand(a);E.push({id:id++,type:'hero',tier:2,r,c,hits:0})}function addEnemy(b=false){let a=empty();if(!a.length)return false;let[r,c]=rand(a);E.push({id:id++,type:b?'boss':'enemy',r,c,hits:0,maxHits:b?bossMax():1,damage:b?bossDamage():enemyDamage()});return true}function at(r,c,skip,list=E){return list.find(x=>x.id!==skip&&x.r===r&&x.c===c)}function step(){return(pieces.clientWidth-24)/4+8}function inner(e){if(e.type==='hero')return`<div class="heroNum">${heroValue(e)}</div><div class="tier">${remain(e)} HP</div>`;if(e.type==='boss'){let b=bossInfo();return`<div class="icon">${b.icon}</div><div class="name">${b.name}</div><div class="tier">${remain(e)} HP · ATK ${e.damage}</div>`}return`<div class="icon">🥷</div><div class="name">暗影刺客</div><div class="tier">1 HP · ATK ${e.damage}</div>`}function render(){pieces.innerHTML='';let s=step();for(let e of E){let d=document.createElement('div');d.className='piece '+(e.type==='hero'?'heroUnit':e.type);d.dataset.id=e.id;d.style.transform=`translate(${e.c*s}px,${e.r*s}px)`;d.innerHTML=inner(e);pieces.appendChild(d)}$('score').textContent=score;$('turn').textContent=turn;$('merges').textContent=mergeCount;$('wave').textContent=bossLevel;let b=E.find(x=>x.type==='boss');$('boss').textContent=b?remain(b)+' HP':Math.max(0,nextBossTurn-turn)}function ghost(e,fr,fc,tr,tc){return{id:e.id,fr,fc,tr,tc,cls:e.type==='hero'?'heroUnit':e.type,html:inner(e)}}async function animate(ms){await wait(ms)}function damage(e,n){let d=Math.min(n,remain(e));if(!d)return;let f=document.createElement('div'),s=step();f.className='damagefx';f.style.transform=`translate(${e.c*s}px,${e.r*s}px)`;f.textContent='−'+d+' HP';effects.appendChild(f);setTimeout(()=>f.remove(),1000);e.hits=(e.hits||0)+d;if(remain(e)<=0)e.dying=true}async function deaths(){let dead=E.filter(x=>x.dying);if(!dead.length)return;for(let e of dead){if(e.type==='hero'){heroesLost++;let p=Math.min(score,heroValue(e));score-=p;deathPenalty+=p}else if(e.type==='enemy'){enemyDefeated++;score+=20;enemyScore+=20}else{score+=100;bossScore+=100;bossDefeated++;bossLevel++;bossActive=false;nextBossTurn=turn+BOSS_INTERVAL}}E=E.filter(x=>!x.dying);render();await animate(DEATH_MS)}function plan(dir){let list=JSON.parse(JSON.stringify(E)),hs=list.filter(x=>x.type==='hero'&&!x.dying),dr=dir==='up'?-1:dir==='down'?1:0,dc=dir==='left'?-1:dir==='right'?1:0,merged=new Set,mids=[],contacts=[],changed=false;hs.sort((a,b)=>dir==='left'?a.c-b.c:dir==='right'?b.c-a.c:dir==='up'?a.r-b.r:b.r-a.r);for(let h of hs){while(true){let nr=h.r+dr,nc=h.c+dc;if(nr<0||nr>=4||nc<0||nc>=4)break;let o=at(nr,nc,h.id,list);if(!o){h.r=nr;h.c=nc;changed=true;continue}if(o.type==='hero'&&o.tier===h.tier&&!merged.has(o.id)){let nt=o.tier*2,rem=Math.min(nt,remain(o)+remain(h));o.tier=nt;o.hits=nt-rem;list=list.filter(x=>x.id!==h.id);merged.add(o.id);mids.push(o.id);changed=true;break}if(o.type!=='hero'){contacts.push([h.id,o.id]);changed=true}break}}return{list,mids,contacts,changed}}function enemyPhase(){let attacks=[];for(let e of E.filter(x=>x.type!=='hero'&&!x.dying)){let hs=E.filter(x=>x.type==='hero'&&!x.dying),adj=hs.filter(h=>Math.abs(h.r-e.r)+Math.abs(h.c-e.c)===1);if(adj.length){attacks.push([e,rand(adj)]);continue}if(!hs.length)continue;let h=hs.sort((a,b)=>(Math.abs(a.r-e.r)+Math.abs(a.c-e.c))-(Math.abs(b.r-e.r)+Math.abs(b.c-e.c)))[0],opts=[[e.r+Math.sign(h.r-e.r),e.c],[e.r,e.c+Math.sign(h.c-e.c)]].filter(([r,c])=>r>=0&&r<4&&c>=0&&c<4&&!at(r,c,e.id));if(opts.length)[e.r,e.c]=opts[0]}return attacks}async function move(dir){if(ended||busy)return;let p=plan(dir);if(!p.changed)return check();busy=true;moveCount++;score++;moveScore++;E=p.list;render();await animate(MOVE_MS);for(let mid of p.mids){let h=E.find(x=>x.id===mid);if(h){mergeCount++;let g=heroValue(h);score+=g;mergeScore+=g;highestTile=Math.max(highestTile,g);for(let e of E.filter(x=>x.type!=='hero'&&Math.abs(x.r-h.r)+Math.abs(x.c-h.c)===1))damage(e,1);if(mergeCount%3===0){let a=E.filter(x=>x.type!=='hero'&&!x.dying);if(a.length)damage(rand(a),1)}if(mergeCount%5===0)for(let e of E.filter(x=>x.type!=='hero'&&!x.dying))damage(e,1)}}for(let[h,e]of p.contacts){let H=E.find(x=>x.id===h),X=E.find(x=>x.id===e);if(H&&X)damage(H,X.damage)}render();await animate(DAMAGE_MS);await deaths();if(!E.some(x=>x.type==='hero')){busy=false;return check()}turn++;let attacks=enemyPhase();render();await animate(MOVE_MS);for(let[e,h]of attacks)if(E.includes(e)&&E.includes(h))damage(h,e.damage);render();await animate(DAMAGE_MS);await deaths();if(!E.some(x=>x.type==='hero')){busy=false;return check()}if(turn%2===0)addEnemy();addHero();if(turn>=nextBossTurn&&!bossActive&&addEnemy(true)){bossActive=true;let b=bossInfo();logEl.textContent=`${b.icon} ${b.name} 登場！${bossMax()} HP / ATK ${bossDamage()}`}render();check();busy=false}function canMove(){return['up','down','left','right'].some(d=>plan(d).changed)}function end(t){if(ended)return;ended=true;$('ot').textContent=t;$('op').innerHTML=`<span class="score">SCORE ${score}</span><b>本局得分</b><br>移動得分：+${moveScore}<br>合併得分：+${mergeScore}<br>擊殺敵人：+${enemyScore}<br>擊敗 Boss：+${bossScore}<br>英雄死亡：−${deathPenalty}<br><br><b>遊戲歷程</b><br>存活回合：${turn}<br>移動次數：${moveCount}<br>合併次數：${mergeCount}<br>🥷 擊殺敵人：${enemyDefeated}<br>👑 擊敗 Boss：${bossDefeated}<br>💀 英雄死亡：${heroesLost}<br>最高英雄數字：${highestTile}`;overlay.classList.add('show')}function check(){if(!E.some(x=>x.type==='hero'))return end('隊伍全滅');if(!canMove())end('無法移動')}function reset(){E=[];turn=mergeCount=0;id=1;ended=bossActive=busy=false;bossLevel=1;bossDefeated=0;nextBossTurn=20;score=moveCount=enemyDefeated=heroesLost=moveScore=mergeScore=enemyScore=bossScore=deathPenalty=0;highestTile=1;effects.innerHTML='';overlay.classList.remove('show');addHero();addHero();addHero();logEl.textContent='v1.0 正式版開始。第一隻 Boss 將在第 20 回合登場。';render()}board.addEventListener('touchstart',e=>{let t=e.changedTouches[0];touch=[t.clientX,t.clientY]},{passive:true});board.addEventListener('touchend',e=>{if(!touch)return;let t=e.changedTouches[0],dx=t.clientX-touch[0],dy=t.clientY-touch[1];if(Math.max(Math.abs(dx),Math.abs(dy))>20)move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up');touch=null},{passive:true});document.addEventListener('keydown',e=>{let m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(m)move(m)});$('restart').onclick=$('again').onclick=reset;reset()})()</script></body></html>
