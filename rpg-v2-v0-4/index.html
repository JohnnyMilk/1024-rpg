<script>(function(){if(window.RPGShared)return;var T={MOVE:250,MERGE:250,EFFECT:750,DEATH:250,SPAWN:450,SLASH:360};function ri(a,r){r=r||Math.random;return a&&a.length?a[Math.floor(r()*a.length)]:null}function ec(es,n){n=n||4;var u=new Set((es||[]).map(function(e){return e.r+','+e.c})),o=[];for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(!u.has(r+','+c))o.push([r,c]);return o}function hp(cur,max,kind,meta){var pct=max>0?Math.max(0,Math.min(100,cur/max*100)):0;return '<div class="unitMeta">'+(meta||'')+'</div><div class="hpWrap"><div class="hpTrack"><div class="hpFill '+(kind==='boss'?'bossHp':'heroHp')+'" style="width:'+pct+'%"></div></div><div class="hpText">'+Math.max(0,cur)+' / '+Math.max(0,max)+' HP</div></div>'}function bind(o){var b=o.board,t=null,th=o.threshold||24,km=o.keyMap||{};function key(e){var k=typeof e.key==='string'?e.key:'',d=km[k]||km[k.toLowerCase()];if(d){e.preventDefault();o.onMove(d)}}function st(e){var x=e.changedTouches&&e.changedTouches[0];if(x)t={x:x.clientX,y:x.clientY}}function en(e){if(!t)return;var x=e.changedTouches&&e.changedTouches[0];if(!x){t=null;return}var dx=x.clientX-t.x,dy=x.clientY-t.y;t=null;if(Math.max(Math.abs(dx),Math.abs(dy))<th)return;o.onMove(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))}window.addEventListener('keydown',key,{passive:false});b.addEventListener('touchstart',st,{passive:true});b.addEventListener('touchend',en,{passive:true})}function hist(c){return '<div class="result"><div class="resultTitle">'+(c.title||'GAME OVER')+'</div><div class="scoreBox"><div class="scoreLabel">總分</div><span class="score">'+Number(c.score||0).toLocaleString()+'</span></div>'+(c.skillsHtml||'')+'<div class="resultActions">'+(c.backHtml||'')+'<button id="again">再玩一次</button></div></div>'}window.RPGShared={TIMING:T,randomItem:ri,emptyCells:ec,healthBar:hp,bindDirectionalInput:bind,renderRunHistory:hist};window.__V04_CORE_FALLBACK__=true})();</script>
