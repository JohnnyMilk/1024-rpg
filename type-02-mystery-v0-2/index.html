<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b1013"><title>1024 Mystery Dungeon V0.2</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090d10;color:#edf2f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}body{overscroll-behavior:none;background:radial-gradient(circle at 50% 0,#273322,#10171a 45%,#070a0c)}.app{width:min(96vw,560px);margin:auto;padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 18px)}header{display:flex;justify-content:space-between;align-items:flex-start;padding:4px 2px}.brand b{font:900 9px ui-monospace,monospace;letter-spacing:.12em;color:#d7b46a}.brand h1{font-size:21px;margin:2px 0}.hud{display:flex;gap:4px}.chip{background:#182127;border:1px solid #344149;border-radius:9px;padding:5px 7px;font-size:9px;font-weight:900;text-align:center}.chip strong{display:block;font-size:13px}.panel{background:#131b1fee;border:1px solid #354249;border-radius:16px;padding:9px;margin:7px 0}.mapwrap{position:relative;width:100%;aspect-ratio:1/1;background:#050809;border-radius:12px;overflow:hidden;touch-action:none}.map{position:absolute;inset:0;display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);gap:1px;padding:2px}.tile{position:relative;display:flex;align-items:center;justify-content:center;background:#090d0f;font-size:clamp(13px,4.7vw,25px);overflow:hidden}.tile.floor{background:#252b29}.tile.wall{background:#101516}.tile.seen.floor{background:#1a201f}.tile.seen.wall{background:#0d1112}.tile.dark{background:#050708}.tile.player{background:#31493a}.tile.exit{background:#243943}.tile.loot{background:#3b3524}.tile.enemy{background:#42282b}.tile.boss{background:#512d45}.num{position:absolute;right:1px;bottom:0;background:#050708d9;border-radius:4px;padding:0 2px;font:900 8px ui-monospace,monospace}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.title h2{margin:0;font-size:15px}.log{height:43px;overflow:hidden;font-size:9px;color:#abb8bd;line-height:1.5}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;width:190px;margin:7px auto}.controls button,.btn{appearance:none;border:1px solid #46555d;background:#182127;color:#edf2f4;border-radius:11px;min-height:43px;font-size:18px;font-weight:900}.controls .blank{visibility:hidden}.btn{font-size:12px;padding:11px;width:100%}.gold{background:#d7b46a;color:#19160f;border-color:#d7b46a}.row{display:flex;gap:6px}.row>*{flex:1}.legend{font-size:9px;color:#8f9ca2;line-height:1.55}.overlay{position:fixed;inset:0;background:#071014e8;display:none;align-items:center;justify-content:center;padding:24px;z-index:10}.overlay.show{display:flex}.modal{width:min(90vw,380px);background:#182127;border:1px solid #46545c;border-radius:20px;padding:22px;text-align:center}.modal .big{font-size:48px}.modal h2{margin:7px}.modal p{font-size:11px;color:#a9b5ba;line-height:1.6}.soul{color:#e6c76f}@media(max-height:760px){.app{padding-top:4px}.panel{padding:6px;margin:5px 0}.controls{margin:4px auto}.controls button{min-height:35px}.mapwrap{max-height:54vh;margin:auto}}
</style></head><body><main class="app"><header><div class="brand"><b>TYPE 02 · MYSTERY DUNGEON · V0.2 POC</b><h1 id="zone">苔痕迷宮</h1></div><div class="hud"><div class="chip">HP<strong id="hp">12/12</strong></div><div class="chip">FLOOR<strong id="floor">1F</strong></div><div class="chip">SOUL<strong id="soul">2</strong></div></div></header>
<section class="panel"><div class="title"><h2>探索地圖</h2><span class="chip">🦴 <strong id="loot">0</strong></span></div><div id="mapwrap" class="mapwrap"><div id="map" class="map"></div></div><div class="controls"><span class="blank"></span><button onclick="act(0,-1)">▲</button><span class="blank"></span><button onclick="act(-1,0)">◀</button><button onclick="waitTurn()">•</button><button onclick="act(1,0)">▶</button><span class="blank"></span><button onclick="act(0,1)">▼</button><span class="blank"></span></div><div class="legend">一步 = 一回合。黑暗區域尚未探索。👺近戰怪會追蹤你；相鄰時攻擊。⬇️ 找到樓梯進入下一層。</div></section>
<section class="panel"><div class="title"><h2>1024 魂力</h2><span class="chip">ATK <strong id="atk">2</strong></span></div><div class="legend">擊敗怪物取得魂力。相同魂力自動合併：<span class="soul">2 + 2 → 4 → 8 → 16</span>。目前最高魂力直接決定攻擊力。這是第一版 1024 成長測試。</div><div id="log" class="log"></div></section>
<div class="row"><button class="btn gold" onclick="retreat()">🏰 安全撤退</button><button class="btn" onclick="restart()">↻ 新 Run</button></div></main>
<div id="overlay" class="overlay"><div class="modal"><div class="big" id="mi">💀</div><h2 id="mt"></h2><p id="mx"></p><button class="btn gold" onclick="closeModal()">再進地下城</button></div></div>
<script>
const W=21,H=21,V=11;const G={bank:0,best:1};let D={};function key(x,y){return y*W+x}function xy(k){return[k%W,Math.floor(k/W)]}function inb(x,y){return x>=0&&y>=0&&x<W&&y<H}
function restart(){D={tiles:Array(W*H).fill(0),seen:new Set(),px:0,py:0,enemies:[],items:new Map(),exit:null,hp:12,max:12,floor:1,loot:0,souls:[2],turn:0,dead:false};makeFloor();render()}
function carveRoom(r){for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)D.tiles[key(x,y)]=1}
function corridor(a,b){let x=a.x,y=a.y;while(x!==b.x){D.tiles[key(x,y)]=1;x+=Math.sign(b.x-x)}while(y!==b.y){D.tiles[key(x,y)]=1;y+=Math.sign(b.y-y)}D.tiles[key(x,y)]=1}
function makeFloor(){D.tiles.fill(0);D.enemies=[];D.items=new Map();D.seen=new Set();let rooms=[];for(let tries=0;tries<80&&rooms.length<7;tries++){let w=3+Math.floor(Math.random()*4),h=3+Math.floor(Math.random()*4),x=1+Math.floor(Math.random()*(W-w-2)),y=1+Math.floor(Math.random()*(H-h-2)),r={x,y,w,h};if(rooms.some(q=>x<q.x+q.w+1&&x+w+1>q.x&&y<q.y+q.h+1&&y+h+1>q.y))continue;carveRoom(r);if(rooms.length)corridor({x:Math.floor(rooms.at(-1).x+rooms.at(-1).w/2),y:Math.floor(rooms.at(-1).y+rooms.at(-1).h/2)},{x:Math.floor(x+w/2),y:Math.floor(y+h/2)});rooms.push(r)}if(rooms.length<2)return makeFloor();let s=rooms[0],e=rooms.at(-1);D.px=Math.floor(s.x+s.w/2);D.py=Math.floor(s.y+s.h/2);D.exit={x:Math.floor(e.x+e.w/2),y:Math.floor(e.y+e.h/2)};let occupied=new Set([key(D.px,D.py),key(D.exit.x,D.exit.y)]),spots=[];D.tiles.forEach((v,i)=>{if(v&&!occupied.has(i))spots.push(i)});spots.sort(()=>Math.random()-.5);let n=Math.min(8,2+Math.floor(D.floor/2));for(let i=0;i<n&&spots.length;i++){let k=spots.pop(),[x,y]=xy(k),base=Math.pow(2,1+Math.min(3,Math.floor((D.floor-1)/4)));D.enemies.push({x,y,v:Math.random()<.72?base:base*2,hp:Math.random()<.72?base:base*2,boss:false});occupied.add(k)}if(D.floor%5===0&&spots.length){let k=spots.pop(),[x,y]=xy(k),v=Math.pow(2,2+Math.min(3,Math.floor(D.floor/5)));D.enemies.push({x,y,v,hp:v*2,boss:true})}for(let i=0;i<2&&spots.length;i++){let k=spots.pop();D.items.set(k,'bone')}reveal();say((D.floor%5===0?'👑 Boss 氣息籠罩這一層。':'🕯️ 進入 '+D.floor+'F。')+' 尋找樓梯。')}
function reveal(){for(let y=D.py-3;y<=D.py+3;y++)for(let x=D.px-3;x<=D.px+3;x++)if(inb(x,y)&&Math.abs(x-D.px)+Math.abs(y-D.py)<=4)D.seen.add(key(x,y))}
function enemyAt(x,y){return D.enemies.find(e=>e.hp>0&&e.x===x&&e.y===y)}function walkable(x,y){return inb(x,y)&&D.tiles[key(x,y)]===1}
function act(dx,dy){if(D.dead)return;let nx=D.px+dx,ny=D.py+dy;if(!walkable(nx,ny))return;let e=enemyAt(nx,ny);if(e){e.hp-=attack();say('⚔️ 你對 '+(e.boss?'👑':'👺')+e.v+' 造成 '+attack()+' 傷害。');if(e.hp<=0){let gain=e.v;gainSoul(gain);D.loot+=e.boss?3:1;say((e.boss?'👑 Boss':'👺 怪物')+' 擊破：獲得魂力 '+gain+'，🦴+'+(e.boss?3:1));D.px=nx;D.py=ny}}else{D.px=nx;D.py=ny;let k=key(nx,ny);if(D.items.has(k)){D.items.delete(k);D.loot++;say('🦴 找到素材，本輪戰利品 +1。')}if(D.exit&&nx===D.exit.x&&ny===D.exit.y){D.floor++;G.best=Math.max(G.best,D.floor);makeFloor();D.turn++;render();return}}endTurn()}
function waitTurn(){if(D.dead)return;endTurn()}function endTurn(){D.turn++;moveEnemies();if(D.dead)return;reveal();render()}
function moveEnemies(){let occupied=new Set(D.enemies.filter(e=>e.hp>0).map(e=>key(e.x,e.y)));for(let e of D.enemies){if(e.hp<=0)continue;let dist=Math.abs(e.x-D.px)+Math.abs(e.y-D.py);if(dist===1){let dmg=Math.max(1,Math.floor(e.v/2));D.hp-=dmg;say((e.boss?'👑':'👺')+e.v+' 攻擊你：-'+dmg+' HP');if(D.hp<=0){die();return}continue}if(dist>7)continue;let opts=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:e.x+dx,y:e.y+dy})).filter(p=>walkable(p.x,p.y)&&!(p.x===D.px&&p.y===D.py)&&!occupied.has(key(p.x,p.y)));opts.sort((a,b)=>(Math.abs(a.x-D.px)+Math.abs(a.y-D.py))-(Math.abs(b.x-D.px)+Math.abs(b.y-D.py)));if(opts.length){occupied.delete(key(e.x,e.y));e.x=opts[0].x;e.y=opts[0].y;occupied.add(key(e.x,e.y))}}}
function gainSoul(v){D.souls.push(v);D.souls.sort((a,b)=>a-b);let changed=true;while(changed){changed=false;for(let i=0;i<D.souls.length-1;i++)if(D.souls[i]===D.souls[i+1]){let n=D.souls[i]*2;D.souls.splice(i,2,n);D.souls.sort((a,b)=>a-b);say('✨ 魂力合併：'+(n/2)+' + '+(n/2)+' → '+n);changed=true;break}}}function attack(){return Math.max(2,...D.souls)}
function die(){D.dead=true;render();setTimeout(()=>modal('💀','探索失敗','你倒在 '+D.floor+'F。本輪 🦴'+D.loot+' 全部失去；最高魂力 '+attack()+' 也隨 Run 結束。'),150)}
function retreat(){if(D.dead)return;G.bank+=D.loot;G.best=Math.max(G.best,D.floor);modal('🏰','安全撤退','你從 '+D.floor+'F 返回城鎮，安全帶回 🦴'+D.loot+'。本次魂力在 Run 結束後重置。')}function modal(i,t,x){mi.textContent=i;mt.textContent=t;mx.textContent=x;overlay.classList.add('show')}function closeModal(){overlay.classList.remove('show');restart()}
function say(s){log.innerHTML=s+'<br>'+log.innerHTML.split('<br>').slice(0,3).join('<br>')}
function render(){hp.textContent=Math.max(0,D.hp)+'/'+D.max;floor.textContent=D.floor+'F';loot.textContent=D.loot;soul.textContent=Math.max(...D.souls);atk.textContent=attack();zone.textContent=['🌲 苔痕迷宮','🪨 赤岩坑道','❄️ 霜封遺跡'][Math.floor((D.floor-1)/5)%3];let ox=Math.max(0,Math.min(W-V,D.px-Math.floor(V/2))),oy=Math.max(0,Math.min(H-V,D.py-Math.floor(V/2))),out='';for(let sy=0;sy<V;sy++)for(let sx=0;sx<V;sx++){let x=ox+sx,y=oy+sy,k=key(x,y),visible=Math.abs(x-D.px)+Math.abs(y-D.py)<=4,seen=D.seen.has(k),floorTile=D.tiles[k]===1,cls='tile '+(floorTile?'floor':'wall')+(seen?' seen':'')+(!seen?' dark':'');let content='';if(visible){let e=enemyAt(x,y);if(x===D.px&&y===D.py){cls+=' player';content='🧙'}else if(e){cls+=e.boss?' boss':' enemy';content=(e.boss?'👑':'👺')+'<span class="num">'+e.v+'</span>'}else if(D.items.has(k)){cls+=' loot';content='🦴'}else if(D.exit&&x===D.exit.x&&y===D.exit.y){cls+=' exit';content='⬇️'}}out+='<div class="'+cls+'">'+content+'</div>'}map.innerHTML=out}
let sx=0,sy=0;mapwrap.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});mapwrap.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;Math.abs(dx)>Math.abs(dy)?act(dx>0?1:-1,0):act(0,dy>0?1:-1)});document.addEventListener('keydown',e=>{let m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(m[e.key]){e.preventDefault();act(...m[e.key])}});restart();
</script></body></html>
