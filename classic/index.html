<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f5efe6">
<title>1024</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#f5efe6;color:#5e5348;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}
body{display:flex;justify-content:center;overscroll-behavior:none}
.app{width:min(94vw,520px);padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
h1{font-size:52px;line-height:1;margin:0;font-weight:900;letter-spacing:-3px}.sub{font-size:14px;opacity:.72;margin-top:8px}
.scorebox{display:flex;gap:8px}.score{min-width:72px;background:#8e7f71;color:white;border-radius:12px;padding:8px 10px;text-align:center}.score span{display:block;font-size:10px;font-weight:800;opacity:.7}.score b{font-size:20px}
.bar{margin:18px 0 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}button{border:0;border-radius:12px;background:#8e7f71;color:white;font-weight:800;padding:11px 15px;font-size:14px}.hint{font-size:12px;opacity:.7;text-align:right}
.board{position:relative;width:min(88vw,430px);aspect-ratio:1;margin:auto;background:#b8aa9c;border-radius:18px;padding:12px;touch-action:none;user-select:none;overflow:hidden}
.grid{position:absolute;inset:12px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:12px}.cell{background:#d4c8bb;border-radius:12px}
.tiles{position:absolute;inset:12px}.tile{position:absolute;width:calc((100% - 36px)/4);height:calc((100% - 36px)/4);display:flex;align-items:center;justify-content:center;border-radius:12px;font-weight:900;font-size:clamp(26px,8vw,42px);box-shadow:0 4px 10px #0001;transition:transform .14s cubic-bezier(.2,.8,.2,1);will-change:transform}
.spawn{animation:spawn .16s ease-out}.merge{animation:merge .2s ease-out}@keyframes spawn{0%{scale:.25;opacity:.3}100%{scale:1;opacity:1}}@keyframes merge{0%{scale:.8}55%{scale:1.18}100%{scale:1}}
.v2{background:#eee4da}.v4{background:#ede0c8}.v8{background:#f2b179;color:#fff}.v16{background:#f59563;color:#fff}.v32{background:#f67c5f;color:#fff}.v64{background:#f65e3b;color:#fff}.v128{background:#edcf72;color:#fff;font-size:34px}.v256{background:#edcc61;color:#fff;font-size:34px}.v512{background:#edc850;color:#fff;font-size:34px}.v1024{background:#edc53f;color:#fff;font-size:29px;box-shadow:0 0 24px #edc53f88}.vbig{background:#3c3a32;color:#fff;font-size:27px}
.overlay{position:absolute;inset:0;background:#f6efe8df;display:none;align-items:center;justify-content:center;text-align:center;z-index:10;padding:30px}.overlay.show{display:flex}.overlay h2{font-size:34px;margin:0 0 7px}.overlay p{margin:0 0 18px;opacity:.72}.overlay .buttons{display:flex;gap:10px;justify-content:center}
.footer{margin:18px auto 0;max-width:430px;font-size:13px;line-height:1.55;opacity:.72}.home{display:inline-block;margin-bottom:14px;color:#6d6258;text-decoration:none;font-weight:800}
@media(max-width:380px){.board{padding:9px}.grid,.tiles{inset:9px}.grid{gap:9px}.tile{width:calc((100% - 27px)/4);height:calc((100% - 27px)/4)}h1{font-size:44px}}
</style>
</head>
<body>
<div class="app">
  <a class="home" href="../">← Prototype Index</a>
  <div class="top">
    <div><h1>1024</h1><div class="sub">Standard / Baseline Version</div></div>
    <div class="scorebox"><div class="score"><span>SCORE</span><b id="score">0</b></div><div class="score"><span>BEST</span><b id="best">0</b></div></div>
  </div>
  <div class="bar"><button id="newGame">新遊戲</button><div class="hint">手機：上下左右滑動<br>電腦：方向鍵 / WASD</div></div>
  <div class="board" id="board"><div class="grid" id="grid"></div><div class="tiles" id="tiles"></div><div class="overlay" id="overlay"><div><h2 id="overlayTitle"></h2><p id="overlayText"></p><div class="buttons"><button id="continueBtn">繼續玩</button><button id="restartBtn">重新開始</button></div></div></div></div>
  <div class="footer">規則：每次有效移動後會隨機生成一個新方塊；相同數字碰撞後合併，一個方塊每回合只能合併一次。</div>
</div>
<script>
(function(){'use strict';const N=4,GOAL=1024;const gridEl=document.getElementById('grid'),tilesEl=document.getElementById('tiles'),boardEl=document.getElementById('board');const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');const overlay=document.getElementById('overlay'),overlayTitle=document.getElementById('overlayTitle'),overlayText=document.getElementById('overlayText'),continueBtn=document.getElementById('continueBtn');for(let i=0;i<16;i++){const d=document.createElement('div');d.className='cell';gridEl.appendChild(d)}let board=Array.from({length:N},()=>Array(N).fill(0));let score=0,best=Number(localStorage.getItem('best1024')||0),locked=false,won=false,touch=null;bestEl.textContent=best;function addRandom(){const e=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(board[r][c]===0)e.push([r,c]);if(!e.length)return;const[r,c]=e[Math.floor(Math.random()*e.length)];board[r][c]=Math.random()<.9?2:4}function tileClass(v){if(v>=2048)return'vbig';return'v'+v}function render(spawnKeys=[],mergeKeys=[]){tilesEl.innerHTML='';const w=tilesEl.clientWidth;const gap=window.innerWidth<=380?9:12;const size=(w-gap*3)/4;for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=board[r][c];if(!v)continue;const d=document.createElement('div');const key=r+','+c;d.className='tile '+tileClass(v)+(spawnKeys.includes(key)?' spawn':'')+(mergeKeys.includes(key)?' merge':'');d.textContent=v;d.style.width=size+'px';d.style.height=size+'px';d.style.transform='translate('+(c*(size+gap))+'px,'+(r*(size+gap))+'px)';tilesEl.appendChild(d)}scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('best1024',String(best))}}function reset(){board=Array.from({length:N},()=>Array(N).fill(0));score=0;locked=false;won=false;overlay.classList.remove('show');addRandom();addRandom();requestAnimationFrame(()=>render())}function compress(line){const vals=line.filter(v=>v!==0),out=[],merged=[];let gain=0;for(let i=0;i<vals.length;i++){if(vals[i]===vals[i+1]){out.push(vals[i]*2);gain+=vals[i]*2;merged.push(out.length-1);i++}else out.push(vals[i])}while(out.length<N)out.push(0);return{line:out,gain,merged}}function arraysEqual(a,b){return a.every((v,i)=>v===b[i])}function move(dir){if(locked||overlay.classList.contains('show'))return;const old=board.map(r=>r.slice());let gained=0,mergeKeys=[];if(dir==='left'||dir==='right'){for(let r=0;r<N;r++){let line=board[r].slice();if(dir==='right')line.reverse();const res=compress(line);gained+=res.gain;let nl=res.line;if(dir==='right')nl=nl.slice().reverse();board[r]=nl;for(const idx of res.merged){const c=dir==='right'?N-1-idx:idx;mergeKeys.push(r+','+c)}}}else{for(let c=0;c<N;c++){let line=[];for(let r=0;r<N;r++)line.push(board[r][c]);if(dir==='down')line.reverse();const res=compress(line);gained+=res.gain;let nl=res.line;if(dir==='down')nl=nl.slice().reverse();for(let r=0;r<N;r++)board[r][c]=nl[r];for(const idx of res.merged){const r=dir==='down'?N-1-idx:idx;mergeKeys.push(r+','+c)}}}let changed=false;for(let r=0;r<N;r++)if(!arraysEqual(old[r],board[r])){changed=true;break}if(!changed)return;locked=true;score+=gained;render([],mergeKeys);setTimeout(()=>{const before=board.map(r=>r.slice());addRandom();let spawn=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(before[r][c]===0&&board[r][c]!==0)spawn.push(r+','+c);render(spawn,[]);locked=false;checkState()},155)}function hasMoves(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(board[r][c]===0)return true;if(c<N-1&&board[r][c]===board[r][c+1])return true;if(r<N-1&&board[r][c]===board[r+1][c])return true}return false}function checkState(){if(!won&&board.some(row=>row.some(v=>v>=GOAL))){won=true;overlayTitle.textContent='你合成 1024 了！';overlayText.textContent='目前分數：'+score.toLocaleString();continueBtn.style.display='inline-block';overlay.classList.add('show');return}if(!hasMoves()){overlayTitle.textContent='遊戲結束';overlayText.textContent='最終分數：'+score.toLocaleString();continueBtn.style.display='none';overlay.classList.add('show')}}window.addEventListener('keydown',e=>{const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};const dir=m[e.key]||m[e.key.toLowerCase()];if(dir){e.preventDefault();move(dir)}},{passive:false});boardEl.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touch={x:t.clientX,y:t.clientY}},{passive:true});boardEl.addEventListener('touchend',e=>{if(!touch)return;const t=e.changedTouches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});document.getElementById('newGame').onclick=reset;document.getElementById('restartBtn').onclick=reset;continueBtn.onclick=()=>overlay.classList.remove('show');window.addEventListener('resize',()=>render());reset();})();
</script>
</body></html>
