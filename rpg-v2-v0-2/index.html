<body><div class="app"><a href="../type-01-v2/">← Version 2</a><div class="top"><div><h1>1024 RPG</h1><div class="sub">VERSION 2 · v0.2</div></div><div class="stats"><div class="stat"><span>SCORE</span><b id="score">0</b></div><div class="stat"><span>TURN</span><b id="turn">0</b></div><div class="stat"><span>MERGE</span><b id="merges">0</b></div><div class="stat"><span>BEST HERO</span><b id="best">1</b></div></div></div><div class="bar"><button id="restart">重新開始</button><div style="font-size:10px;color:#8996a2;text-align:right">新最高數字<br>技能三選一</div></div><div class="log" id="log">v0.2：敵方攻擊回復揮劍斬擊動畫。</div><section class="skillbar"><div class="skillbar-head"><b>本局技能</b><span>點擊圖示查看效果</span></div><div class="skill-icons" id="skillIcons"><div class="empty-skills">尚未取得技能</div></div></section><div class="board" id="board"><div class="grid" id="grid"></div><div class="pieces" id="pieces"></div><div class="effects" id="effects"></div></div><div class="rules"><b>Version 2 v0.2：</b>沿用 v0.1 Skill Pool 與新最高數字三選一。敵方近戰攻擊回復早期版本的揮劍斬擊動畫。動畫序列固定為：<b>移動 → 合併 → 攻擊與 HP 跳字同步（最多 0.75 秒）→ 死亡 → 死亡觸發攻擊與 HP → 下一波死亡</b>。</div></div><div class="modal" id="modal"><div class="panel" id="panel"></div></div>
