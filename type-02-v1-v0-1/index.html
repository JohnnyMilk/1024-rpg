<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0e1519"><title>1024 Type 02 · V1 v0.1 POC</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:#0d1317;color:#edf2f2}body{background:radial-gradient(circle at 70% 0,rgba(86,143,119,.16),transparent 28%),#0d1317;padding-bottom:env(safe-area-inset-bottom)}button{font:inherit}.app{width:min(96vw,1050px);margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 10px 35px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.brand small{display:block;font:900 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.13em;color:#79b69a}.brand b{font-size:20px}.actions{display:flex;gap:7px}.btn{border:1px solid #314049;background:#182127;color:#dce4e5;border-radius:10px;padding:8px 10px;font-size:11px;font-weight:800}.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:9px}.meter{background:#141d22;border:1px solid #27343b;border-radius:12px;padding:8px 7px}.meter small{display:block;color:#7f9099;font-size:9px}.meter b{font-size:16px}.meter .bar{height:3px;background:#263139;border-radius:9px;margin-top:6px;overflow:hidden}.meter .bar i{display:block;height:100%;background:#79b69a;width:50%}.main{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:10px}.panel{background:#121a1f;border:1px solid #26333a;border-radius:17px;padding:11px}.panelTitle{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}.panelTitle b{font-size:13px}.panelTitle span{font:800 9px/1 ui-monospace,Menlo,monospace;color:#72838c;letter-spacing:.08em}.board{aspect-ratio:1;background:#0a1013;border:1px solid #2b3b42;border-radius:15px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;touch-action:none;user-select:none}.cell{background:#172127;border-radius:11px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.tile{position:absolute;inset:3px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 12px #0004}.tile .icon{font-size:clamp(20px,7vw,35px);line-height:1}.tile b{font-size:9px;margin-top:3px}.tile em{font-style:normal;font:800 8px/1 ui-monospace,Menlo,monospace;opacity:.72;margin-top:2px}.res{background:#314a43}.ind{background:#4a4035}.ene{background:#354450}.pub{background:#3e4650}.hint{text-align:center;color:#70818a;font-size:10px;margin-top:7px}.sim{display:flex;flex-direction:column;gap:9px}.city{min-height:220px;position:relative;overflow:hidden;border-radius:15px;background:linear-gradient(#17262c 0 48%,#253832 48% 54%,#1a2425 54%);border:1px solid #304047}.sky{position:absolute;inset:0;background:radial-gradient(circle at 78% 18%,rgba(238,205,128,.32),transparent 15%)}.skyline{position:absolute;left:4%;right:4%;bottom:42%;height:46%;display:flex;align-items:flex-end;justify-content:center;gap:4px}.building{width:10%;min-width:17px;background:#51666a;border:2px solid #26373b;border-bottom:0;border-radius:3px 3px 0 0;position:relative}.building:after{content:'··\A··\A··';white-space:pre;position:absolute;inset:5px;text-align:center;color:#d7c783;line-height:8px;font-size:10px;overflow:hidden}.park{background:#42604c}.factory{background:#62594b}.power{background:#4b5e68}.road{position:absolute;left:0;right:0;bottom:17%;height:20%;background:#2c3436;border-top:2px solid #697172;border-bottom:2px solid #697172}.road:after{content:'';position:absolute;left:0;right:0;top:48%;border-top:2px dashed #b6a76c}.car{position:absolute;bottom:26%;font-size:17px;animation:drive 6s linear infinite}.car.two{animation-duration:9s;animation-delay:-4s}@keyframes drive{from{left:-8%}to{left:105%}}.people{position:absolute;bottom:4%;left:5%;right:5%;font-size:15px;letter-spacing:7px;white-space:nowrap;overflow:hidden}.cityLabel{position:absolute;left:10px;top:9px;background:#0b1114bb;border:1px solid #33444b;border-radius:9px;padding:6px 8px}.cityLabel b{display:block;font-size:12px}.cityLabel small{font-size:9px;color:#8da0a8}.log{background:#10171b;border:1px solid #243139;border-radius:13px;padding:10px;min-height:92px}.log b{font-size:11px}.log p{font-size:11px;color:#91a1a9;line-height:1.55;margin:5px 0 0}.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px}.legend div{font-size:10px;color:#91a0a8;background:#11191e;border-radius:9px;padding:7px}.event{position:fixed;inset:0;background:#071013d9;display:none;align-items:center;justify-content:center;padding:22px;z-index:10}.event.show{display:flex}.eventCard{width:min(92vw,390px);background:#172127;border:1px solid #426052;border-radius:20px;padding:20px;box-shadow:0 20px 60px #0009}.eventCard small{color:#79b69a;font-weight:900;letter-spacing:.12em}.eventCard h2{margin:7px 0}.eventCard p{color:#aab7bc;line-height:1.6}.choices{display:grid;gap:8px}.choice{border:1px solid #35474e;background:#10181c;color:#e7eded;border-radius:12px;padding:12px;text-align:left}.choice b{display:block}.choice span{font-size:10px;color:#8fa0a8}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);background:#dce7df;color:#152019;padding:8px 12px;border-radius:999px;font-size:11px;font-weight:900;opacity:0;transition:.2s;pointer-events:none;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:720px){.main{grid-template-columns:1fr}.city{min-height:205px}.app{width:min(100vw,500px)}.meters{position:sticky;top:0;z-index:4;background:#0d1317;padding:5px 0}.meter b{font-size:14px}}</style></head><body><main class="app"><header class="top"><div class="brand"><small>TYPE 02 · VERSION 1 · v0.1 POC</small><b>1024 CITY</b></div><div class="actions"><button class="btn" onclick="location.href='../type-02/'">企劃</button><button class="btn" id="resetBtn">重新開始</button></div></header><section class="meters"><div class="meter"><small>👥 人口</small><b id="pop">0</b><div class="bar"><i id="popBar"></i></div></div><div class="meter"><small>💰 財政</small><b id="cash">$0</b><div class="bar"><i id="cashBar"></i></div></div><div class="meter"><small>⚡ 能源</small><b id="energy">0%</b><div class="bar"><i id="energyBar"></i></div></div><div class="meter"><small>😊 幸福</small><b id="happy">0</b><div class="bar"><i id="happyBar"></i></div></div></section><section class="main"><div class="panel"><div class="panelTitle"><b>城市規劃棋盤</b><span id="day">DAY 1</span></div><div class="board" id="board"></div><div class="hint">上下左右滑動 · 同類型、同等級建築才能合併 · 有效滑動 = 1 天</div></div><div class="panel sim"><div class="panelTitle"><b>LIVE CITY</b><span>SIMULATION RESULT</span></div><div class="city"><div class="sky"></div><div class="cityLabel"><b id="cityLevel">聚落</b><small id="citySub">城市正在形成</small></div><div class="skyline" id="skyline"></div><div class="road"></div><div class="car">🚙</div><div class="car two">🚕</div><div class="people" id="people">🚶 🚶‍♀️</div></div><div class="log"><b>市政日誌</b><p id="logText">滑動棋盤開始第一天的城市規劃。每一次有效決策都會讓城市向前一天。</p></div><div class="legend"><div>🏠 住宅：人口、能源需求</div><div>🏭 工商：收入、工作、污染</div><div>⚡ 能源：供電能力</div><div>🌳 公共：幸福、維護費</div></div></div></section></main><div class="event" id="event"><div class="eventCard"><small>CITY EVENT</small><h2 id="eventTitle"></h2><p id="eventText"></p><div class="choices" id="choices"></div></div></div><div class="toast" id="toast"></div><script>(()=>{'use strict';const N=4,TYPES=['res','ind','ene','pub'],META={res:{icon:'🏠',name:'住宅'},ind:{icon:'🏭',name:'工商'},ene:{icon:'⚡',name:'能源'},pub:{icon:'🌳',name:'公共'}};let grid=[],day=1,cash=800,happy=70,eventBonus={cash:0,happy:0};const $=id=>document.getElementById(id);function empty(){return Array.from({length:N},()=>Array(N).fill(null))}function tile(){let r=Math.random(),type=r<.38?'res':r<.66?'ind':r<.82?'ene':'pub';return{type,lv:1}}function cells(){let a=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])a.push([r,c]);return a}function spawn(n=1){for(let k=0;k<n;k++){let a=cells();if(!a.length)return;let [r,c]=a[Math.floor(Math.random()*a.length)];grid[r][c]=tile()}}function compress(line){let a=line.filter(Boolean),out=[],merged=0;for(let i=0;i<a.length;i++){if(i<a.length-1&&a[i].type===a[i+1].type&&a[i].lv===a[i+1].lv){out.push({type:a[i].type,lv:a[i].lv+1});i++;merged++}else out.push(a[i])}while(out.length<N)out.push(null);return{line:out,merged}}function snapshot(){return JSON.stringify(grid)}function move(dir){let before=snapshot(),m=0;if(dir==='left'||dir==='right'){for(let r=0;r<N;r++){let line=grid[r].slice();if(dir==='right')line.reverse();let x=compress(line);if(dir==='right')x.line.reverse();grid[r]=x.line;m+=x.merged}}else{for(let c=0;c<N;c++){let line=[];for(let r=0;r<N;r++)line.push(grid[r][c]);if(dir==='down')line.reverse();let x=compress(line);if(dir==='down')x.line.reverse();for(let r=0;r<N;r++)grid[r][c]=x.line[r];m+=x.merged}}if(snapshot()===before)return;day++;spawn();simulate(m);render();if(day%7===0)showEvent();if(!canMove())setTimeout(()=>alert('城市規劃棋盤已無法移動。\n這次 POC 的城市存續 '+day+' 天。'),100)}function totals(){let t={res:0,ind:0,ene:0,pub:0,max:1,count:0};grid.flat().forEach(x=>{if(!x)return;let v=2**(x.lv-1);t[x.type]+=v;t.max=Math.max(t.max,x.lv);t.count++});return t}function stats(){let t=totals(),pop=Math.round(t.res*18*(.65+Math.min(1,t.ind/(t.res||1))*.35)),demand=t.res*8+t.ind*10+t.pub*4,supply=t.ene*24+12,energy=Math.min(100,Math.round(supply/Math.max(1,demand)*100)),jobs=t.ind*24,employment=Math.min(1,jobs/Math.max(1,pop)),baseHappy=58+t.pub*5-employment<.5?0:0;let h=Math.round(58+t.pub*4-Math.max(0,t.ind-t.pub)*3+Math.min(12,employment*12)+(energy<80?(energy-80)/3:5)+eventBonus.happy);h=Math.max(5,Math.min(100,h));return{...t,pop,demand,supply,energy,jobs,employment,h}}function simulate(merges){let s=stats(),income=Math.round(s.ind*22+s.pop*.45),cost=Math.round(s.res*3+s.ene*5+s.pub*10);cash+=income-cost+eventBonus.cash;eventBonus.cash=0;eventBonus.happy*=.7;let msg=merges?`今天完成 ${merges} 次建築升級。`:'今天重新配置了城市用地。';if(s.energy<80)msg+=' ⚠️ 供電開始吃緊。';else if(s.employment<.55)msg+=' ⚠️ 住宅成長快於工作機會。';else if(s.h>80)msg+=' 市民對城市發展相當滿意。';$('logText').textContent=msg}function render(){let s=stats(),b=$('board');b.innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){let cell=document.createElement('div');cell.className='cell';let x=grid[r][c];if(x){let d=document.createElement('div');d.className='tile '+x.type;d.innerHTML=`<span class="icon">${META[x.type].icon}</span><b>${META[x.type].name}</b><em>LV.${x.lv}</em>`;cell.appendChild(d)}b.appendChild(cell)}$('day').textContent='DAY '+day;$('pop').textContent=s.pop.toLocaleString();$('cash').textContent='$'+Math.round(cash).toLocaleString();$('energy').textContent=s.energy+'%';$('happy').textContent=s.h;$('popBar').style.width=Math.min(100,s.pop/4)+'%';$('cashBar').style.width=Math.max(0,Math.min(100,cash/30))+'%';$('energyBar').style.width=s.energy+'%';$('happyBar').style.width=s.h+'%';let lvl=s.pop>500?'都會':s.pop>220?'城市':s.pop>80?'小鎮':'聚落';$('cityLevel').textContent=lvl;$('citySub').textContent=`${s.pop} 人 · ${s.jobs} 工作 · 電力 ${s.supply}/${s.demand}`;renderCity(s)}function renderCity(s){let el=$('skyline');el.innerHTML='';let arr=grid.flat().filter(Boolean).sort((a,b)=>b.lv-a.lv).slice(0,9);arr.forEach(x=>{let d=document.createElement('div');d.className='building '+(x.type==='pub'?'park':x.type==='ind'?'factory':x.type==='ene'?'power':'');d.style.height=(22+x.lv*15)+'%';d.style.width=(8+Math.min(5,x.lv))+'%';el.appendChild(d)});let n=Math.max(2,Math.min(12,Math.ceil(s.pop/35)));$('people').textContent=Array.from({length:n},(_,i)=>i%3===0?'🚶‍♀️':'🚶').join(' ')}function canMove(){if(cells().length)return true;for(let r=0;r<N;r++)for(let c=0;c<N;c++){let x=grid[r][c];for(let [dr,dc] of [[1,0],[0,1]]){let y=grid[r+dr]?.[c+dc];if(y&&x.type===y.type&&x.lv===y.lv)return true}}return false}const EVENTS=[{t:'週末市集',p:'居民希望封街舉辦市集。',a:[['舉辦市集','財政 +180 / 幸福 +5',()=>{cash+=180;eventBonus.happy+=5}],['維持交通','不花錢 / 幸福 -3',()=>eventBonus.happy-=3]]},{t:'老舊電網警報',p:'工程團隊建議提前維護供電設備。',a:[['立即維護','財政 -220 / 幸福 +3',()=>{cash-=220;eventBonus.happy+=3}],['延後處理','保留預算 / 幸福 -4',()=>eventBonus.happy-=4]]},{t:'城市綠化提案',p:'市民團體提出新的街道綠化計畫。',a:[['批准','$ -150 / 幸福 +7',()=>{cash-=150;eventBonus.happy+=7}],['暫緩','無成本',()=>{}]]}];function showEvent(){let e=EVENTS[Math.floor(Math.random()*EVENTS.length)];$('eventTitle').textContent=e.t;$('eventText').textContent=e.p;let ch=$('choices');ch.innerHTML='';e.a.forEach(a=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<b>${a[0]}</b><span>${a[1]}</span>`;b.onclick=()=>{a[2]();$('event').classList.remove('show');render();toast('決策已執行')};ch.appendChild(b)});$('event').classList.add('show')}function toast(t){let x=$('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1200)}function reset(){grid=empty();day=1;cash=800;happy=70;eventBonus={cash:0,happy:0};spawn(4);render();$('logText').textContent='滑動棋盤開始第一天的城市規劃。每一次有效決策都會讓城市向前一天。'}$('resetBtn').onclick=()=>{if(confirm('重新開始這座城市？'))reset()};let sx=0,sy=0;$('board').addEventListener('touchstart',e=>{let t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});$('board').addEventListener('touchend',e=>{let t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});addEventListener('keydown',e=>{let m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(m){e.preventDefault();move(m)}});reset()})();</script></body></html>
